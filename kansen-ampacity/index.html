<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071624">
  <meta name="description" content="第二種電気工事士・幹線の許容電流を4問で身につける学習アプリ">
  <title>幹線 許容電流トレーニング</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071624'/%3E%3Cpath d='M36 5 15 35h15l-3 24 22-33H34z' fill='%23ffc857'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#071624;--navy2:#0d2236;--panel:#112a40;--line:#264963;--paper:#f6fbff;--muted:#a9bfd0;--cyan:#54d6e7;--amber:#ffc857;--green:#59dc9a;--red:#ff6f76;--shadow:0 24px 70px rgba(0,0,0,.3)}
    *{box-sizing:border-box}
    html{font-size:16px}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#143957 0,transparent 34%),linear-gradient(145deg,var(--navy),#091b2b 62%,#06131e);color:var(--paper);font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.65}
    button{font:inherit}
    button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    .shell{width:min(1040px,100%);margin:auto;padding:22px clamp(16px,4vw,42px) 44px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:12px}
    .bolt{display:grid;place-items:center;width:42px;height:42px;border:1px solid #37617e;border-radius:13px;background:#0b2032;color:var(--amber);font-size:1.45rem;box-shadow:inset 0 0 20px rgba(84,214,231,.08)}
    h1{font-size:clamp(1.15rem,3vw,1.55rem);line-height:1.25;margin:0;letter-spacing:.03em}
    .eyebrow{display:block;color:var(--cyan);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
    .rule-toggle{border:1px solid var(--line);background:#0d263a;color:var(--paper);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
    .rule-toggle:hover{border-color:var(--cyan)}
    .rule-panel{display:none;background:linear-gradient(135deg,#132f46,#0b2134);border:1px solid #2f5671;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
    .rule-panel.open{display:block;animation:drop .24s ease-out}
    .rule-title{font-size:.92rem;color:var(--cyan);font-weight:800;margin-bottom:10px}
    .rules{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
    .rule{padding:13px 15px;background:#091c2c;border:1px solid #234761;border-radius:14px}
    .rule b{display:block;color:var(--amber);font-size:1.02rem;margin-bottom:3px}
    .or{align-self:center;color:var(--muted);font-size:.78rem;font-weight:800}
    .progress-wrap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:16px}
    .progress-track{height:8px;background:#19364d;border-radius:99px;overflow:hidden}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit;transition:width .35s ease}
    .progress-label{font-size:.82rem;color:var(--muted);font-weight:700;min-width:62px;text-align:right}
    .app-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:18px;align-items:start}
    .card{background:linear-gradient(160deg,rgba(20,49,73,.98),rgba(10,30,47,.98));border:1px solid #2a506c;border-radius:24px;box-shadow:var(--shadow)}
    .quiz{padding:clamp(18px,4vw,30px);min-height:590px;position:relative;overflow:hidden}
    .quiz:before{content:"";position:absolute;right:-90px;top:-110px;width:230px;height:230px;border:1px solid rgba(84,214,231,.13);border-radius:50%;box-shadow:0 0 0 35px rgba(84,214,231,.025),0 0 0 70px rgba(84,214,231,.018);pointer-events:none}
    .qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;position:relative}
    .badge{font-size:.76rem;letter-spacing:.08em;font-weight:900;color:#071624;background:var(--cyan);border-radius:99px;padding:5px 11px}
    .mode{font-size:.8rem;color:var(--muted)}
    .question{font-size:clamp(1.03rem,2.1vw,1.22rem);font-weight:700;line-height:1.75;margin:0 0 18px;position:relative}
    .circuit{background:#f7fbfd;color:#173044;border-radius:17px;padding:17px;margin:0 0 19px;border:1px solid #bcd3df;min-height:110px;display:grid;grid-template-columns:58px 1fr;align-items:center}
    .trunk{height:5px;background:#27475a;position:relative;border-radius:3px}
    .trunk:after{content:"B";position:absolute;right:5px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:25px;height:25px;border:2px solid #27475a;background:#fff;font-weight:900;font-size:.76rem}
    .loads{border-left:4px solid #27475a;padding-left:20px;display:grid;gap:9px}
    .load{position:relative;display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;min-height:28px}
    .load:before{content:"";position:absolute;left:-20px;width:17px;height:3px;background:#27475a}
    .device{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid currentColor;border-radius:50%;font-weight:900;background:#fff}
    .device.motor{color:#1268a0}.device.heater{color:#b85e20}
    .load strong{font-size:1rem}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .choice{min-height:62px;border:1px solid #345b75;background:#0c2437;color:var(--paper);border-radius:15px;padding:12px;cursor:pointer;font-size:1.08rem;font-weight:900;transition:transform .14s,border-color .14s,background .14s;position:relative}
    .choice:hover{transform:translateY(-2px);border-color:var(--cyan);background:#102e45}
    .choice:disabled{cursor:default;transform:none}
    .choice.correct{border-color:var(--green);background:#123f38;color:#c7ffe3}
    .choice.wrong{border-color:var(--red);background:#4a202a;color:#ffd3d5;animation:shake .3s}
    .feedback{display:none;margin-top:15px;padding:15px 16px;border-radius:15px;border:1px solid}
    .feedback.show{display:block;animation:drop .22s ease-out}
    .feedback.good{background:#113b35;border-color:#307a62}.feedback.bad{background:#42202a;border-color:#a84d58}
    .feedback-title{font-weight:900;margin-bottom:4px}.feedback.good .feedback-title{color:var(--green)}.feedback.bad .feedback-title{color:#ff9da2}
    .formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800;color:var(--amber);margin:5px 0}
    .next{display:none;width:100%;margin-top:13px;border:0;border-radius:15px;background:var(--amber);color:#172334;padding:14px;font-weight:900;cursor:pointer;box-shadow:0 8px 22px rgba(255,200,87,.18)}
    .next.show{display:block}
    .side{padding:20px;position:sticky;top:18px}
    .side h2{font-size:.9rem;color:var(--muted);margin:0 0 12px;letter-spacing:.05em}
    .steps{display:grid;gap:11px}
    .step{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding-bottom:11px;border-bottom:1px solid #24465f}
    .step:last-child{border:0;padding-bottom:0}
    .stepnum{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#173a55;color:var(--cyan);font-weight:900}
    .step b{display:block;font-size:.88rem}.step span{color:var(--muted);font-size:.78rem;line-height:1.5}
    .streak{margin-top:17px;padding:14px;border-radius:14px;background:#091e2f;border:1px solid #234862;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .streak small{color:var(--muted);display:block}.streak strong{color:var(--amber);font-size:1.1rem}
    .lock{margin-top:10px;color:var(--muted);font-size:.78rem;text-align:center}
    .summary{display:none;text-align:center;padding:28px 10px;position:relative}
    .summary.show{display:block;animation:drop .3s ease-out}
    .quiz-body.hidden{display:none}
    .score-ring{width:130px;height:130px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--green) 0 100%,#1d3d53 0);position:relative}
    .score-ring:after{content:"";position:absolute;inset:10px;background:#102a40;border-radius:50%}
    .score{position:relative;z-index:1}.score strong{display:block;font-size:2rem;line-height:1}.score span{font-size:.78rem;color:var(--muted)}
    .summary h2{font-size:1.5rem;margin:0 0 6px}.summary p{color:var(--muted);margin:0 auto 20px;max-width:420px}
    .summary-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .action{border:1px solid #38617c;background:#102c43;color:var(--paper);border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
    .action.primary{background:var(--amber);border-color:var(--amber);color:#172334}
    .unlock{display:none;margin:16px auto 0;padding:12px 15px;max-width:390px;border:1px solid #6b5a2e;background:#332c18;border-radius:13px;color:#ffe4a0;font-weight:800}
    .unlock.show{display:block}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
    .confetti i{position:absolute;top:-18px;width:9px;height:15px;animation:fall 1.8s ease-in forwards}
    footer{text-align:center;color:#7191a7;font-size:.72rem;margin-top:22px}
    @keyframes drop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
    @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(620deg)}}
    @media(max-width:760px){.shell{padding-top:14px}.app-grid{grid-template-columns:1fr}.side{position:static}.quiz{min-height:0}.rules{grid-template-columns:1fr}.or{text-align:center}.choices{grid-template-columns:1fr 1fr}.circuit{grid-template-columns:47px 1fr;padding:14px}.brand .eyebrow{font-size:.65rem}}
    @media(max-width:410px){.rule-toggle{padding:8px 10px;font-size:.82rem}.choices{grid-template-columns:1fr}.choice{min-height:54px}.quiz{padding:17px}.side{padding:17px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="bolt" aria-hidden="true">ϟ</div><div><span class="eyebrow">第二種電気工事士</span><h1>幹線 許容電流トレーニング</h1></div></div>
      <button class="rule-toggle" id="ruleToggle" aria-expanded="false" aria-controls="rulePanel">公式を見る</button>
    </header>

    <section class="rule-panel" id="rulePanel">
      <div class="rule-title">覚えるのは、50Aを境にした2つだけ</div>
      <div class="rules">
        <div class="rule"><b>電動機の合計 ≤ 50A</b>許容電流 ＝ 電動機 × 1.25 ＋ その他</div>
        <div class="or">または</div>
        <div class="rule"><b>電動機の合計 ＞ 50A</b>許容電流 ＝ 電動機 × 1.1 ＋ その他</div>
      </div>
    </section>

    <div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="progress-label" id="progressLabel">1 / 4</div></div>

    <div class="app-grid">
      <section class="card quiz" aria-live="polite">
        <div class="quiz-body" id="quizBody">
          <div class="qmeta"><span class="badge" id="qBadge">問題 1</span><span class="mode" id="modeLabel">基本モード</span></div>
          <p class="question" id="question"></p>
          <div class="circuit" id="circuit" aria-label="接続された負荷の図"></div>
          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback"><div class="feedback-title" id="feedbackTitle"></div><div id="feedbackText"></div></div>
          <button class="next" id="nextBtn">次の問題へ</button>
        </div>
        <div class="summary" id="summary">
          <div class="score-ring" id="scoreRing"><div class="score"><strong id="scoreNumber">4/4</strong><span>正解</span></div></div>
          <h2 id="summaryTitle">全問正解！</h2>
          <p id="summaryText"></p>
          <div class="summary-actions"><button class="action primary" id="retryBtn">もう1周する</button><button class="action" id="randomBtn" hidden>ランダム挑戦</button></div>
          <div class="unlock" id="unlockMessage">ランダムモードが解放されました！</div>
        </div>
      </section>

      <aside class="card side">
        <h2>解き方は毎回この3手</h2>
        <div class="steps">
          <div class="step"><div class="stepnum">1</div><div><b>電動機だけを合計</b><span>Mの電流を全部足す</span></div></div>
          <div class="step"><div class="stepnum">2</div><div><b>50Aと比べる</b><span>50A以下は1.25倍、超えたら1.1倍</span></div></div>
          <div class="step"><div class="stepnum">3</div><div><b>その他を最後に足す</b><span>電熱器Hは倍率をかけない</span></div></div>
        </div>
        <div class="streak"><div><small>連続満点</small><strong id="streakValue">0 / 2</strong></div><div aria-hidden="true">⚡</div></div>
        <div class="lock" id="lockText">2周連続満点でランダムモード解放</div>
      </aside>
    </div>
    <footer>端末内に学習記録を保存します</footer>
  </main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
  (() => {
    const QUESTIONS = [
      {
        id:1,
        text:'定格電流がそれぞれ20A、8Aの電動機を1台ずつ接続しました。幹線の太さを決める根拠となる電流の最小値は？',
        loads:[['M',20],['M',8]], options:[25,28,31,35], answer:35,
        formula:'(20＋8) × 1.25 ＝ 35A', note:'電動機の合計は28A。50A以下なので1.25倍します。'
      },
      {
        id:2,
        text:'定格電流20Aの電動機2台と、30Aの電動機1台を接続しました。需要率100%のとき、電流の最小値は？',
        loads:[['M',20],['M',20],['M',30]], options:[70,77,87.5,210], answer:77,
        formula:'(20＋20＋30) × 1.1 ＝ 77A', note:'電動機の合計は70A。50Aを超えるので1.1倍します。'
      },
      {
        id:3,
        text:'図のように電動機と電熱器を接続しました。需要率100%のとき、幹線の太さを決める根拠となる電流の最小値は？',
        loads:[['M',50],['M',30],['H',15],['H',5]], options:[100,108,115,120], answer:108,
        formula:'(50＋30) × 1.1 ＋ (15＋5) ＝ 108A', note:'電動機80Aだけを1.1倍し、電熱器20Aはそのまま足します。'
      },
      {
        id:4,
        text:'図のように電動機と電熱器を接続しました。需要率100%のとき、幹線の太さを決める根拠となる電流の最小値は？',
        loads:[['M',20],['M',20],['H',10],['H',10]], options:[60,64,70,140], answer:70,
        formula:'(20＋20) × 1.25 ＋ (10＋10) ＝ 70A', note:'電動機40Aは50A以下なので1.25倍し、電熱器20Aを足します。'
      }
    ];
    const $ = s => document.querySelector(s);
    const els = {question:$('#question'),circuit:$('#circuit'),choices:$('#choices'),feedback:$('#feedback'),feedbackTitle:$('#feedbackTitle'),feedbackText:$('#feedbackText'),next:$('#nextBtn'),badge:$('#qBadge'),mode:$('#modeLabel'),bar:$('#progressBar'),label:$('#progressLabel'),body:$('#quizBody'),summary:$('#summary'),score:$('#scoreNumber'),ring:$('#scoreRing'),summaryTitle:$('#summaryTitle'),summaryText:$('#summaryText'),random:$('#randomBtn'),unlock:$('#unlockMessage'),streak:$('#streakValue'),lock:$('#lockText')};
    let saved = {perfectStreak:0,randomUnlocked:false};
    try { saved = {...saved,...JSON.parse(localStorage.getItem('kansenAmpacityProgress')||'{}')}; } catch(e) {}
    let order=[0,1,2,3], index=0, score=0, hadMistake=false, currentMistake=false, answered=false, randomMode=false;

    function persist(){ try{localStorage.setItem('kansenAmpacityProgress',JSON.stringify(saved));}catch(e){} }
    function updateSavedUI(){els.streak.textContent=Math.min(saved.perfectStreak,2)+' / 2';els.random.hidden=!saved.randomUnlocked;els.lock.textContent=saved.randomUnlocked?'ランダムモード解放済み':'2周連続満点でランダムモード解放';}
    function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
    function renderCircuit(loads){return '<div class="trunk"></div><div class="loads">'+loads.map(([type,amps])=>'<div class="load"><span class="device '+(type==='M'?'motor':'heater')+'">'+type+'</span><strong>'+amps+'A</strong><span>'+(type==='M'?'電動機':'電熱器')+'</span></div>').join('')+'</div>';}
    function render(){
      const q=QUESTIONS[order[index]]; answered=false;currentMistake=false;
      els.body.classList.remove('hidden');els.summary.classList.remove('show');
      els.badge.textContent='問題 '+(index+1);els.mode.textContent=randomMode?'ランダムモード':'基本モード';
      els.question.textContent=q.text;els.circuit.innerHTML=renderCircuit(q.loads);
      els.choices.innerHTML=q.options.map(v=>'<button class="choice" data-value="'+v+'" aria-label="'+v+'アンペア">'+v+' A</button>').join('');
      els.feedback.className='feedback';els.feedbackTitle.textContent='';els.feedbackText.innerHTML='';els.next.className='next';
      els.next.textContent=index===order.length-1?'結果を見る':'次の問題へ';
      els.bar.style.width=((index)/order.length*100)+'%';els.label.textContent=(index+1)+' / '+order.length;
      els.choices.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>answer(Number(btn.dataset.value),btn)));
    }
    function answer(value,btn){
      if(answered)return;const q=QUESTIONS[order[index]];
      if(value===q.answer){
        answered=true;if(!currentMistake)score++;btn.classList.add('correct');els.choices.querySelectorAll('button').forEach(b=>b.disabled=true);
        els.feedback.className='feedback good show';els.feedbackTitle.textContent='正解！';els.feedbackText.innerHTML='<div class="formula">'+q.formula+'</div>'+q.note;
        els.next.classList.add('show');tone(660,.08);setTimeout(()=>tone(880,.12),90);
      }else{
        hadMistake=true;currentMistake=true;btn.classList.add('wrong');btn.disabled=true;
        els.feedback.className='feedback bad show';els.feedbackTitle.textContent='もう一度！';els.feedbackText.innerHTML='<div>'+hint(q)+'</div><div class="formula">まず、Mだけを合計しよう。</div>';
        tone(170,.12);
      }
    }
    function hint(q){const motors=q.loads.filter(x=>x[0]==='M').reduce((s,x)=>s+x[1],0);return '電動機の合計は '+motors+'A。使う倍率は '+(motors<=50?'1.25':'1.1')+' です。';}
    function next(){if(!answered)return;if(index<order.length-1){index++;render();}else{finish();}}
    function finish(){
      els.body.classList.add('hidden');els.summary.classList.add('show');els.bar.style.width='100%';els.label.textContent='完了';els.score.textContent=score+'/'+order.length;els.ring.style.background='conic-gradient(var(--green) 0 '+(score/order.length*100)+'%,#1d3d53 0)';
      const perfect=score===order.length&&!hadMistake;let unlockedNow=false;
      if(perfect){saved.perfectStreak=Math.min(2,saved.perfectStreak+1);if(saved.perfectStreak>=2&&!saved.randomUnlocked){saved.randomUnlocked=true;unlockedNow=true;}els.summaryTitle.textContent='全問正解！';els.summaryText.textContent=saved.randomUnlocked?'50Aの境目と、電熱器を最後に足す流れが身につきました。':'あと'+(2-saved.perfectStreak)+'周、ノーミス満点でランダムモード解放です。';confetti();}
      else{saved.perfectStreak=0;els.summaryTitle.textContent='もう一歩！';els.summaryText.textContent='間違えた問題を意識して、もう一度4問に挑戦しましょう。';}
      persist();updateSavedUI();els.unlock.classList.toggle('show',unlockedNow);
    }
    function restart(random){randomMode=random&&saved.randomUnlocked;order=randomMode?shuffle([0,1,2,3]):[0,1,2,3];index=0;score=0;hadMistake=false;els.unlock.classList.remove('show');render();}
    function tone(freq,duration){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration);o.onended=()=>c.close();}catch(e){}}
    function confetti(){const box=$('#confetti'),colors=['#54d6e7','#ffc857','#59dc9a','#ff6f76','#f6fbff'];box.innerHTML='';for(let i=0;i<45;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.45+'s';p.style.setProperty('--drift',(Math.random()*180-90)+'px');box.appendChild(p);}setTimeout(()=>box.innerHTML='',2500);}
    $('#ruleToggle').addEventListener('click',e=>{const panel=$('#rulePanel'),open=panel.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open);e.currentTarget.textContent=open?'公式を閉じる':'公式を見る';});
    els.next.addEventListener('click',next);$('#retryBtn').addEventListener('click',()=>restart(false));els.random.addEventListener('click',()=>restart(true));
    updateSavedUI();render();

    const context=document.modelContext;
    if(context?.registerTool){
      const register=(tool)=>Promise.resolve(context.registerTool(tool)).catch(()=>{});
      register({name:'read_current_question',title:'現在の問題を読む',description:'幹線許容電流トレーニングで現在表示中の問題と選択肢を返します。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){const q=QUESTIONS[order[index]];return {questionNumber:index+1,text:q.text,choices:q.options.map(v=>v+'A'),mode:randomMode?'random':'basic'};}});
      register({name:'answer_current_question',title:'現在の問題に答える',description:'現在表示中の問題にアンペア値で回答し、画面にも結果を反映します。',inputSchema:{type:'object',properties:{amps:{type:'number'}},required:['amps'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input.amps!=='number')throw new Error('amps must be a number');const button=[...els.choices.querySelectorAll('button')].find(b=>Number(b.dataset.value)===input.amps);if(!button)throw new Error('Choose one of the visible answers');answer(input.amps,button);return {correct:input.amps===QUESTIONS[order[index]].answer,answeredAmps:input.amps};}});
    }
  })();
  </script>
