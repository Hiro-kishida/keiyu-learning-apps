<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRAMMAR RUSH — 英文法スプリント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161233; --card:#221C4D; --card2:#2B2460;
  --ink:#F6F2FF; --sub:#9D93C9;
  --heat:#6FD6FF; --heat-soft:rgba(111,214,255,.18);
  --good:#5EE6A8; --bad:#FF6B81; --gold:#FFD75E;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;
  overflow:hidden; user-select:none;
}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:16px;position:relative}

.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
.big-btn{
  background:var(--heat); color:#161233;
  font-weight:800;font-size:19px;padding:17px;border-radius:999px;width:100%;
  box-shadow:0 6px 0 rgba(0,0,0,.35); transition:transform .08s;
}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big-btn.alt{background:var(--card2);color:var(--ink);margin-top:10px}
.ghost-btn{background:var(--card);color:var(--sub);font-weight:700;font-size:14px;padding:13px;border-radius:999px;width:100%;margin-top:10px}
.eyebrow{font-size:11px;letter-spacing:.25em;color:var(--sub);font-weight:700}

/* ===== ホーム ===== */
#home{justify-content:flex-start;gap:12px;overflow-y:auto;padding-top:2vh}
.logo{font-family:'Archivo Black',sans-serif;font-size:17px;line-height:1;letter-spacing:-.02em}
.logo .rush{color:var(--heat)}
.stat-row{display:flex;gap:8px}
.stat{flex:1;background:var(--card);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:800}
.stat span{font-size:10px;color:var(--sub);font-weight:700}
#toneBox{background:var(--card);border-radius:var(--r);padding:14px}
#toneBox h3{font-size:11px;letter-spacing:.2em;color:var(--sub);margin-bottom:9px}
#toneChips{display:flex;flex-wrap:wrap;gap:7px}
#rangeBox{background:var(--card);border-radius:var(--r);padding:14px}
#rangeBox h3{font-size:11px;letter-spacing:.2em;color:var(--sub);margin-bottom:9px}
.range-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.range-row input{width:78px;background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:9px 10px;font-size:15px;font-weight:800;color:var(--ink);text-align:center}
.range-row input:focus{outline:none;border-color:var(--heat)}
.range-row .dash{color:var(--sub);font-weight:800}
.range-now{margin-top:8px;font-size:12px;font-weight:700;color:var(--heat)}
.chip{
  background:var(--card2);border:1.5px solid transparent;border-radius:999px;
  padding:8px 13px;font-size:12px;font-weight:800;color:var(--sub);
  transition:transform .07s;
}
.chip:active{transform:scale(.94)}
.chip.sel{border-color:var(--heat);color:var(--heat);background:var(--heat-soft)}
#reviewBadge{display:none;background:var(--heat-soft);border:1.5px dashed var(--heat);color:var(--heat);border-radius:var(--r);padding:11px 14px;font-size:13px;font-weight:700;width:100%;text-align:left}
#zukanBtn{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--r);padding:13px 14px;width:100%;font-size:13px;font-weight:800;text-align:left}
#zukanBtn .pct{color:var(--gold)}

/* ===== クイズ ===== */
#hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#qnum{font-weight:800;color:var(--sub);font-size:14px}
#lives{font-size:14px;letter-spacing:2px}
.timerbar{height:8px;background:#0F0C26;border-radius:99px;overflow:hidden;margin-bottom:14px}
#timerfill{height:100%;background:var(--heat);width:100%;border-radius:99px}
#qcard{
  background:var(--card);border-radius:24px;padding:22px 18px;text-align:left;
  position:relative;border:2px solid transparent;
}
#qword{font-size:clamp(17px,4.6vw,21px);line-height:1.65;font-weight:700;word-break:normal;overflow-wrap:break-word}
#qword .lead{display:block;color:var(--gold);font-size:13px;font-weight:800;margin-bottom:8px}
#choices{display:grid;gap:12px;margin-top:14px;flex:1;align-content:start;overflow-y:auto}
.choice{
  background:var(--card2);border-radius:var(--r);padding:15px 14px;font-size:18px;font-weight:700;
  text-align:left;display:flex;align-items:center;gap:12px;
  transition:transform .07s, background .15s;border:2px solid transparent;
}
.choice:active{transform:scale(.97)}
.choice .key{min-width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);flex:none}
.choice.correct{background:rgba(94,230,168,.16);border-color:var(--good);color:var(--good)}
.choice.wrong{background:rgba(255,107,129,.14);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.choice.dim{opacity:.35}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ===== 解説オーバーレイ(間違えたときだけ) ===== */
#expl{display:none;position:fixed;inset:0;z-index:150;background:rgba(10,8,30,.86);
  align-items:center;justify-content:center;padding:22px}
#explCard{background:var(--card);border-radius:22px;padding:22px 20px;width:100%;max-width:400px;animation:pop .3s;
  max-height:80dvh;overflow-y:auto}
#explCard h4{font-size:12px;letter-spacing:.15em;color:var(--bad);font-weight:800;margin-bottom:10px}
#explAns{font-size:19px;font-weight:800;color:var(--good);margin-bottom:12px;line-height:1.4}
#explBody{font-size:15px;line-height:1.8;color:var(--ink);font-weight:500}
.exp-sec{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10)}
.exp-sec h5{font-size:11px;letter-spacing:.12em;color:var(--sub);font-weight:800;margin-bottom:8px}
.exp-wrong{display:flex;gap:8px;margin-bottom:9px;line-height:1.65}
.exp-wrong .wc{color:var(--bad);font-weight:800;font-size:13px;flex:none;max-width:42%}
.exp-wrong .wt{font-size:13px;color:var(--ink);font-weight:500;opacity:.92}
.exp-plus{margin-top:14px;background:rgba(111,214,255,.10);border-left:3px solid var(--heat);border-radius:8px;padding:11px 12px;font-size:14px;line-height:1.7}
.exp-plus .pl{font-size:11px;letter-spacing:.12em;color:var(--heat);font-weight:800;display:block;margin-bottom:5px}
.exp-ex{margin-top:9px;font-size:14px;line-height:1.65}
.exp-ex .en{font-weight:700}
.exp-ex .ja{color:var(--sub);font-size:13px;font-weight:500}
#explTap{margin-top:16px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}

/* ===== 結果 ===== */
#result{justify-content:center;text-align:center}
#resScore{font-family:'Archivo Black';font-size:60px;color:var(--heat)}
#resMode{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.2em}
#resBest{font-size:13px;font-weight:800;color:var(--good);min-height:20px;margin-top:2px}
#resWrong{background:var(--card);border-radius:var(--r);padding:14px;text-align:left;font-size:14px;max-height:34dvh;overflow-y:auto;margin:14px 0}
#resWrong h4{font-size:11px;color:var(--sub);letter-spacing:.15em;margin-bottom:8px}
#resWrong .w{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700;line-height:1.5}
#resWrong .w b{display:block;font-size:13px;font-weight:700;margin-bottom:3px}
#resWrong .w span{color:var(--good);font-weight:800;font-size:13px}
#praise{display:none;font-size:17px;font-weight:800;color:var(--gold);margin-bottom:6px;animation:pop .5s}

/* ===== 図鑑 ===== */
#zukan{overflow:hidden}
#zukanHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
#zukanHead h2{font-family:'Archivo Black';font-size:22px}
#zukanPct{color:var(--gold);font-weight:800}
.zbar{height:9px;background:#0F0C26;border-radius:99px;overflow:hidden;margin-bottom:12px}
#zfill{height:100%;background:var(--gold);width:0%;border-radius:99px}
#zlist{flex:1;overflow-y:auto;background:var(--card);border-radius:var(--r);padding:6px 14px}
.zw{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-weight:700;font-size:13px;line-height:1.55}
.zw .ztop{display:flex;align-items:flex-start;gap:9px}
.znum{color:var(--heat);font-weight:800;font-size:12px;min-width:34px;font-family:'Archivo Black',sans-serif;flex:none;padding-top:2px}
.zq{flex:1;font-weight:600}
.zw .zans{color:var(--sub);font-weight:500;font-size:12px;margin-top:4px;margin-left:43px}
.zw.locked{opacity:.35}
.zw .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
.zw .tag.m{background:rgba(255,215,94,.18);color:var(--gold)}
.zw .tag.t{background:rgba(111,214,255,.15);color:#6FD6FF}
.zw .tag.w{background:rgba(255,107,129,.15);color:var(--bad)}

/* ===== 全問正解 演出 ===== */
#celebrate{position:fixed;inset:0;z-index:200;pointer-events:none;display:none;overflow:hidden;background:transparent}
#arashiBg{position:absolute;inset:0;opacity:0;background:
  linear-gradient(120deg,#FF5BA8,#FF9F43,#FFD75E,#5EE6A8,#6FD6FF,#A86CFF,#FF5BA8);
  background-size:300% 300%}
#arashiBg.go{animation:arBgFade 3.2s ease-out forwards, rbShift2 3s linear infinite}
@keyframes arBgFade{0%{opacity:0}12%{opacity:.85}82%{opacity:.85}100%{opacity:0}}
@keyframes rbShift2{from{background-position:0 0}to{background-position:300% 300%}}
.praise-word{position:absolute;will-change:transform,opacity;pointer-events:none;
  font-family:'M PLUS Rounded 1c','Archivo Black',sans-serif;font-weight:900;white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,.25),0 0 18px rgba(255,255,255,.5)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,255,255,0));opacity:0}
#flash.go{animation:flashAnim .5s ease-out}
@keyframes flashAnim{0%{opacity:.9}100%{opacity:0}}
.confetti{position:fixed;width:10px;height:10px;top:-12px;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110dvh) rotate(720deg)}}

/* なまえ */
#nameBtn{background:none;color:var(--sub);font-size:13px;font-weight:700;padding:4px 0 0;text-align:left}
#nameModal{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);z-index:100;align-items:center;justify-content:center;padding:24px}
#nameCard{background:var(--card);border-radius:22px;padding:24px 20px;width:100%;max-width:340px;text-align:center;animation:pop .3s}
#nameCard h3{font-size:16px;font-weight:800;margin-bottom:4px}
#nameCard p{font-size:12px;color:var(--sub);margin-bottom:14px}
#nameInput{width:100%;background:#0F0C26;border:1.5px solid var(--card2);border-radius:14px;color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;padding:13px;text-align:center;user-select:text;-webkit-user-select:text;outline:none}
#nameInput:focus{border-color:var(--heat)}
#nameBtns{display:flex;gap:10px;margin-top:14px}
#nameBtns button{flex:1;border-radius:999px;padding:12px;font-weight:800;font-size:14px}
#nameOk{background:var(--heat);color:#161233}
#nameSkip{background:var(--card2);color:var(--sub)}
#sndToggle{position:absolute;top:16px;right:16px;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:18px;z-index:5}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="celebrate">
    <div id="arashiBg"></div>
    <div id="flash"></div>
  </div>
  <button id="sndToggle" aria-label="サウンド切り替え">🔊</button>

  <!-- ホーム -->
  <section id="home" class="screen active">
    <div>
      <p class="eyebrow">英文法スプリント</p>
      <h1 class="logo">GRAMMAR <span class="rush">RUSH</span></h1>
      <button id="nameBtn"></button>
    </div>
    <div class="stat-row">
      <div class="stat"><b id="stSurv">0</b><span>サバイバル記録</span></div>
      <div class="stat"><b>🔥<span id="stStreak">0</span></b><span>連続日数</span></div>
      <div class="stat"><b id="stAcc">-%</b><span>正答率</span></div>
    </div>
    <div id="toneBox">
      <h3>♪ 効果音の音色(タップで試聴)</h3>
      <div id="toneChips"></div>
    </div>
    <button id="zukanBtn">📖 問題図鑑 <span class="pct" id="zukanRate">0%</span></button>
    <button id="reviewBadge">⚡ 苦手な問題が <b id="weakCount">0</b> 問 — 復習しよう</button>
    <div id="rangeBox">
      <h3>📏 出題範囲(問題番号)</h3>
      <div class="range-row">
        <input id="rangeLo" type="number" inputmode="numeric">
        <span class="dash">〜</span>
        <input id="rangeHi" type="number" inputmode="numeric">
        <button id="rangeSet" class="chip sel">セット</button>
        <button id="rangeAll" class="chip">全部</button>
      </div>
      <div id="rangeNow" class="range-now"></div>
    </div>
    <div style="margin-top:auto;padding-top:8px">
      <button class="big-btn" id="startBtn">スプリント(8問)▶</button>
      <button class="big-btn alt" id="survBtn">🛡 サバイバル(3ミスで終了)</button>
      <button class="ghost-btn" id="reviewBtn" style="display:none">苦手だけ復習する</button>
    </div>
  </section>

  <!-- クイズ -->
  <section id="quiz" class="screen">
    <div id="hud">
      <span id="qnum">Q1 / 8</span>
      <span id="lives"></span>
    </div>
    <div class="timerbar"><div id="timerfill"></div></div>
    <div id="qcard">
      <div id="qword"></div>
    </div>
    <div id="choices"></div>
  </section>

  <!-- 解説(間違えたときだけ) -->
  <div id="expl">
    <div id="explCard">
      <h4>✗ もう一歩</h4>
      <div id="explAns"></div>
      <div id="explBody"></div>
      <div id="explTap">タップで次へ ▶</div>
    </div>
  </div>

  <!-- 結果 -->
  <section id="result" class="screen">
    <p class="eyebrow" id="resMode">RESULT</p>
    <div id="praise"></div>
    <div id="resScore">0</div>
    <div id="resBest"></div>
    <div id="resWrong" style="display:none"><h4>まちがえた問題</h4><div id="resWrongList"></div></div>
    <button class="big-btn" id="againBtn">もう1回 ▶</button>
    <button class="ghost-btn" id="homeBtn">ホームへ</button>
  </section>

  <!-- 図鑑 -->
  <section id="zukan" class="screen">
    <div id="zukanHead"><h2>問題図鑑</h2><span id="zukanPct">0%</span></div>
    <div class="zbar"><div id="zfill"></div></div>
    <div id="zlist"></div>
    <button class="ghost-btn" id="zukanBack">ホームへ戻る</button>
  </section>

  <!-- なまえ入力 -->
  <div id="nameModal">
    <div id="nameCard">
      <h3>なまえを教えてね</h3>
      <p>あとで「ようこそ」のところから変えられます</p>
      <input id="nameInput" maxlength="10" placeholder="ニックネームでもOK">
      <div id="nameBtns"><button id="nameSkip">あとで</button><button id="nameOk">けってい</button></div>
    </div>
  </div>
</div>

<script>
/* ================= 問題データ =================
   [番号, 問題文, 正解, 誤答1, 誤答2, 誤答3, 解説]
   ・空所は ( ) で表記
   ・下線同意型は問題文の先頭に 【○○ と同じ意味は?】 を付ける
*/
const QUESTIONS = [
[848,"I cannot ( ) a kimono by myself, so my mother always helps me.","put on","wear","wearing","wear out","put on A / put A on「A(衣服など)を身につける」。put on は「着る」という1回の動作、wear は「着ている」という状態を表す。"],
[849,"That hat is just the color I've been looking for. May I ( ), please?","try it on","do away with it","tear it off","search it","try on A / try A on「A(衣服など)を試着する」。代名詞が目的語のときは必ず try it on の語順。"],
[850,"【take off と同じ意味は?】Please take off your shoes after you step into the entrance.","remove","repair","regain","restrict","take off A / take A off「A(衣服など)を脱ぐ」(= remove A)。目的語を取らない take off は「離陸する」。"],
[851,"【turn down と同じ意味は?】He had to turn down his employees' request.","reject","accept","criticize","follow","turn down A / turn A down「A(申し出・要求・招待など)を断る」(= reject A)。「A(の音量)を下げる」の意味もある。"],
[852,"Hey, I love this song. Could you turn ( ) the volume, please?","up","out","into","from","turn up A / turn A up「A(の音量)を上げる」(⇔ turn down A / turn A down)。"],
[853,"Please be sure to ( ) the gas before you leave the apartment.","turn off","stop off","blow out","shut out","turn off A / turn A off「A(水道・ガスなど)を止める/A(テレビ・照明など)を消す」(⇔ turn on A)。"],
[854,"【put off と同じ意味は?】The game has been put off due to the bad weather.","postponed","cancelled","expected","announced","put off A / put A off「A（予定など）を延期する」= postpone A。put off doing「…することを延期する」の形もある。"],
[855,"【call off と同じ意味は?】The trip to Disneyland has been called off because of the weather.","cancelled","postponed","designed","planned","call off A / call A off「A（予定など）を中止する」= cancel A。put off「延期する」との違いに注意。"],
[856,"【pick up と同じ意味は?】Within a few days, I managed to pick up a little French.","learn","load","hear of","speak up","pick up A / pick A up「A（言葉・技術など）を習得する」= learn A。"],
[857,"Would you ( ) me up at the station at six?","pick","bring","catch","take","pick up A / pick A up「A（人）を車で迎えに行く［来る］」。ここでは pick me up「私を車で迎えに来る」。"],
[858,"【picked out と同じ意味は?】Cathy picked out a good book to give to her brother as a graduation gift.","selected","delivered","hid","published","pick out A / pick A out「Aを選び出す」= choose A / select A。"],
[859,"Please ( ) away your things when you've finished using them.","put","go","get","pass","put away A / put A away「Aを片付ける／元の場所へしまう」。"],
[860,"【put away と同じ意味は?】Every month I try to put away some money.","save","rescue","spend","make","put away A / put A away「A（お金・時間・食物など）をとっておく／蓄える」= save A。"],
[861,"【put aside と同じ意味は?】John is a hard worker and he makes it a rule to put aside 20 percent of his income every month.","save","spend","send","score","put aside A / put A aside「A（お金・時間・食物など）をとっておく／蓄える」= save A。"],
[862,"【set up と同じ意味は?】I'm planning to set up a joint venture with them.","establish","come over","get out","make in","set up A / set A up「A（会社・制度・施設など）を設立する」= establish A。"],
[863,"Charley made ( ) a very good excuse about why he was late for class.","up","in","off","away","make up A / make A up「A（話・弁解・うそなど）をでっちあげる」= invent A。make up A には「Aを構成する」の意味もある。"],
[864,"【make out と同じ意味は?】The book contained many hard words, and Ann could not make out what the writer meant.","understand","create","show","produce","make out A / make A out「Aを理解する」= understand A / comprehend A。"],
[865,"【figure out と同じ意味は?】Can you figure out this word?","understand","hear","imagine","calculate","figure out A / figure A out「Aを理解する」= understand A / comprehend A / make out A。"],

[722,"(　　) of the jobs Susan performs include ordering office supplies, filing, and cleaning the office.","Some","A little","Little","Much","some of A は『Aの一部［何人か／いくつか］』の意。A には可算名詞の複数形か不可算名詞が来る。また A には the / this / that / these / those / 所有格などがついた特定の名詞や代名詞が来る。本問では the jobs が複数形で特定されているので Some が正しい。（訳: スーザンの行う業務の一部は、事務用品の発注、書類の整理、社内の清掃を含んでいる。）",{core:"some of A は『Aの一部［何人か／いくつか］』の意。A には可算名詞の複数形か不可算名詞が来る。また A には the / this / that / these / those / 所有格などがついた特定の名詞や代名詞が来る。本問では the jobs が複数形で特定されているので Some が正しい。",wrongs:[["A little","a little of A の A には不可算名詞が来るので不可。"],["Little","little of A の A には不可算名詞が来るので不可。"],["Much","much of A の A には不可算名詞が来るので不可。"]],ex:["some of his colleagues / some of this ice","彼の同僚の何人か／この氷の一部"]}],

[727,"Kenji has two brothers, but he is not on speaking terms with them. In other words, he doesn’t talk to (　　) of them.","either","which","both","neither","not ... either (of A) は『（Aの）どちらも…ない』の意で neither (of A) と同意。否定語 doesn’t があるので either が正解。neither を使うなら he talks to neither of them とする。（訳: ケンジには2人の兄弟がいるが、彼らとは口をきく間柄ではない。つまり彼は2人のどちらとも話をしない。）",{core:"not ... either (of A) は『（Aの）どちらも…ない』の意で neither (of A) と同意。否定語 doesn’t があるので either が正解。neither を使うなら he talks to neither of them とする。",wrongs:[["both","not ... both は部分否定の意味になり、文意が成立しない。"]]}],

[740,"The two dogs are so alike that no one can tell one from (　　).","the other","another","other","others","2つの要素があるとき、『一方』を one で指し、『他方／もう一方』を the other で指す。2つの要素の中でどちらか不特定の1つを選ぶと、残りの1つは特定のものになるので other に the をつける。残りは1つなので複数にはしない。（訳: その2匹の犬はとても似ているので、だれにも見分けがつかない。）",{core:"2つの要素があるとき、『一方』を one で指し、『他方／もう一方』を the other で指す。2つの要素の中でどちらか不特定の1つを選ぶと、残りの1つは特定のものになるので other に the をつける。残りは1つなので複数にはしない。",wrongs:[["another","another は同じ種類の『別のもの／別の人』の意で、原則として2つの要素の中の特定の残り1つには用いない。"],["other","other は形容詞で〈the other＋名詞〉のように用い、形容詞 other を単独で使うことはない。"]]}],

[743,"There’re many kinds of flowers in this garden. Some are red, and (　　) are yellow.","others","the other","other","another","others は同じ種類の『他のもの／他の人』の意で、another の複数形だと理解すればよい。本問のように some ..., (and) others ...『…のものもあれば、～のものもある／…の人もいれば、～の人もいる』の形で用いる場合が多い。（訳: この庭園にはたくさんの種類の花がある。赤いものもあれば、黄色いものもある。）",{core:"others は同じ種類の『他のもの／他の人』の意で、another の複数形だと理解すればよい。本問のように some ..., (and) others ...『…のものもあれば、～のものもある／…の人もいれば、～の人もいる』の形で用いる場合が多い。",plus:"others には『他人（＝other people）』の意味もある。〈形容詞 other＋名詞〉を代名詞化すると、〈another＋単数名詞〉→another、〈the other＋単数名詞〉→the other、〈other＋複数名詞〉→others、〈the other＋複数名詞〉→the others。",ex:["Some like coffee, and others like tea. / You should be kind to others.","コーヒーを好む人もいれば、紅茶を好む人もいる。／他人には親切にすべきだ。"]}],

[747,"Sexual harassment is a serious issue and should be treated as (　　).","such","if","much","yet","代名詞 such が前文の名詞を受けて、as such の形で『そういうものとして／それなりに』の意を表すことがある。be treated[recognized / accepted] as such などで用いられる。本問の such は a serious issue を受ける。（訳: セクシャルハラスメントは深刻な問題であり、そういうものとして扱われるべきである。）",{core:"代名詞 such が前文の名詞を受けて、as such の形で『そういうものとして／それなりに』の意を表すことがある。be treated[recognized / accepted] as such などで用いられる。本問の such は a serious issue を受ける。"}],
[748,"空所に共通する1語を選ぶ。 (a) Wealth, as (　　), does not matter much. (b) She told her story in (　　) a way that we all laughed.","such","so","same","this","as such には『そのこと自体（は）／それだけで（は）』という意味もある。また in such a way that S V ... は『…するように／…するようなやり方で』。（訳: (a) 富はそれ自体は大して重要ではない。 (b) 私たち全員が笑うように彼女は自分の話をした。）",{core:"as such には『そのこと自体（は）／それだけで（は）』という意味もある。また in such a way that S V ... は『…するように／…するようなやり方で』。"}],
[749,"“Do you think the teacher will really fail us?” “From the low scores on our final test, (　　).”","I’m afraid so","I hope so","I’m afraid not","I cannot hope so","対話が成立するためには I’m afraid that the teacher will really fail us.『残念だが先生は本当に私たちを落第させると思う』という英文にする必要がある。肯定内容の that 節の代わりに so を用いるので I’m afraid so が正解。（訳: 「先生が本当に私たちを落第させると思う？」「期末テストの悪い成績からすれば、残念だけどそうなるね」）",{core:"対話が成立するためには I’m afraid that the teacher will really fail us.『残念だが先生は本当に私たちを落第させると思う』という英文にする必要がある。肯定内容の that 節の代わりに so を用いるので I’m afraid so が正解。",wrongs:[["I hope so","I hope so だと『先生が私たちを落第させることを願う』という文意となり不自然。"]],plus:"fail『（人）を落第させる』"}],
[750,"“Is Betty coming to my birthday party tonight?” “(　　). She is busy with her homework.”","I suppose not","I don’t suppose it","I suppose it","I suppose so","対話が成立するためには I suppose that Betty is not coming to your birthday party tonight.『ベティーは今夜の君の誕生日パーティーには来ないと思う』という英文にする必要がある。否定内容の that 節の代わりに not を用いるので I suppose not が正解。（訳: 「ベティーは今夜の僕の誕生日パーティーに来るかな？」「来ないだろうな。彼女は宿題で忙しいよ」）",{core:"対話が成立するためには I suppose that Betty is not coming to your birthday party tonight.『ベティーは今夜の君の誕生日パーティーには来ないと思う』という英文にする必要がある。否定内容の that 節の代わりに not を用いるので I suppose not が正解。",wrongs:[["I don’t suppose it","that 節の代わりに it を用いることはできないので不可。"],["I suppose it","that 節の代わりに it を用いることはできないので不可。"],["I suppose so","『彼女はパーティーに来ると思う』の意になり、対話が成立しない。"]]}],
[751,"(a) The matter doesn’t concern me in the least. (b) I have (　　) to do with the matter.","nothing","something","anything","much","have ... to do with A は『Aと…の関係がある』の意。空所には関係の程度の大小に応じて much / a lot / something / nothing / a little / little などが来る。本問は『まったく関係がない』なので nothing。（訳: (a) その件は私にはまったく関係がない。 (b) 私はその件とは何の関係もない。）",{core:"have ... to do with A は『Aと…の関係がある』の意。空所には関係の程度の大小に応じて much / a lot / something / nothing / a little / little などが来る。本問は『まったく関係がない』なので nothing。",plus:"I have a lot [something / a little / little] to do with the matter.『私はその件とは大いに関係がある［何らかの関係がある／少し関係がある／ほとんど関係がない］』"}],
[752,"われわれのチームの勝利は、監督の攻撃的な戦術と大いに関係があった。 Our team’s (　　) coach’s aggressive strategies.","victory had much to do with our","victory had to do much with our","victory had our much to do with","victory much had to do with our","have much to do with A は『Aと大いに関係がある』の意。much を a lot にしても同意。（訳: われわれのチームの勝利は、監督の攻撃的な戦術と大いに関係があった。）",{core:"have much to do with A は『Aと大いに関係がある』の意。much を a lot にしても同意。"}],

[754,"There seems to be (　　) with this wall clock; it doesn’t work at all.","something the matter","something matter","anything matter","nothing the matter","There is something the matter with A. は『Aにはどこか悪いところがある』。the matter の代わりに wrong を用いた There is something wrong with A. も同じ意味。本問は述語動詞 is が seems to be に変形された形。（訳: この掛け時計はどこか調子が悪いようだ。まったく動かない。）",{core:"There is something the matter with A. は『Aにはどこか悪いところがある』。the matter の代わりに wrong を用いた There is something wrong with A. も同じ意味。本問は述語動詞 is が seems to be に変形された形。",plus:"関連表現：There is nothing the matter[wrong] with A.『Aにはどこも悪いところがない』／Something is the matter[wrong] with A.『Aはどこか悪いところがある』／Nothing is the matter[wrong] with A.『Aにはどこも悪いところがない』／What’s the matter[wrong] with A?『Aはどうしたの／Aはどこか悪いの』",ex:["“What’s the matter [wrong] with you? You look pale.” “Nothing is the matter [wrong]. I’m fine.”","「どうしたの？ 顔色が悪いよ」「どこも悪くありません。元気ですよ」"]}],

[757,"We enjoyed (　　) at the party last week.","ourselves","our","really","us","主語と同一の人［もの］を表す再帰代名詞を他動詞の目的語に用いる用法がある。enjoy には再帰代名詞を目的語にとって『楽しむ』という意味になる用法があり、本問は主語 We と同一の目的語なので ourselves。（訳: 私たちは先週のパーティーで楽しんだ。）",{core:"主語と同一の人［もの］を表す再帰代名詞を他動詞の目的語に用いる用法がある。enjoy には再帰代名詞を目的語にとって『楽しむ』という意味になる用法があり、本問は主語 We と同一の目的語なので ourselves。",plus:"他動詞の目的語に再帰代名詞を用いて自動詞的な意味になる動詞：enjoy oneself『楽しむ』、hide oneself『隠れる』、dress oneself『服を着る』、seat oneself『座る』"}],

[759,"お疲れのようですね。どうぞ入っておくつろぎください。 You look tired. Do (　　).","come in and make yourself at home","make yourself at home and come in","come and in make at home yourself","yourself come in and make at home","at home は『くつろいで』の意。Make yourself at home. は『あなた自身をくつろぐようにしなさい』が直訳。文頭の Do は命令文を強調して『どうぞ／ぜひ…してください』の意味を表す。（訳: お疲れのようですね。どうぞ入っておくつろぎください。）",{core:"at home は『くつろいで』の意。Make yourself at home. は『あなた自身をくつろぐようにしなさい』が直訳。文頭の Do は命令文を強調して『どうぞ／ぜひ…してください』の意味を表す。"}],

[762,"Most of the work that most people have to do is not in (　　) interesting.","itself","little","that","them","この表現は『もの・事』に対して in itself / in themselves という形で用いるのが原則。（訳: ほとんどの人々がしなければならない仕事の大半は、それ自体は、おもしろいものではない。）",{core:"この表現は『もの・事』に対して in itself / in themselves という形で用いるのが原則。",plus:"関連表現：(all) by oneself『ひとりで／独力で』、for oneself『独力で』、(all) to oneself『自分だけに』、between ourselves『ここだけの話だが』、be beside oneself (with A)『（Aで）我を忘れる／取り乱す』、in spite of oneself『思わず』"}],
[32,"The tallest building in my town (　　) 50 years ago.","was built","has built","has been built","built","受動態の基本形は〈S＋be動詞＋過去分詞（＋by A）〉で、「Sは（Aによって）…される」という意味。主語 building と他動詞 build は「建物が建設される」という受動の関係なので、④ was built が正解。「だれによって」建てられたかは不明なので、by A は不要。（訳: 私の町で一番高い建物は50年前に建てられた。）",{core:"受動態の基本形は〈S＋be動詞＋過去分詞（＋by A）〉で、「Sは（Aによって）…される」という意味。主語 building と他動詞 build は「建物が建設される」という受動の関係なので、④ was built が正解。「だれによって」建てられたかは不明なので、by A は不要。",wrongs:[["has been built","現在完了の受動態だが、明らかに過去を表す 50 years ago があるので、現在完了は使えない。"]]}],
[33,"He (　　) captain of the team by the boys.","was chosen","has chosen","chose","chooses","SVOC の文の受動態は〈be動詞＋過去分詞＋補語〉の語順になる。主語 he と他動詞 choose は受動の関係なので、② was chosen が正解。名詞 captain は補語。元の能動態は The boys chose him captain of the team.（訳: 彼は少年たちによってチームのキャプテンに選ばれた。）",{core:"SVOC の文の受動態は〈be動詞＋過去分詞＋補語〉の語順になる。主語 he と他動詞 choose は受動の関係なので、② was chosen が正解。名詞 captain は補語。元の能動態は The boys chose him captain of the team.",plus:"captain や mayor「市長」といった公的な役職・役割を表す語が補語になるときには、a や the のような冠詞をつけない。 ／ choose「…を選ぶ」の活用：choose-chose-chosen",ex:["The dog is called “Momo.”","その犬は「モモ」と呼ばれている。"]}],
[34,"How often are the flowers (　　) during the summer?","watered","water","been watered","watering","疑問詞を使う疑問文の受動態では、〈疑問詞＋be動詞＋S＋過去分詞（＋by A）?〉の語順になる。主語 the flowers と他動詞 water は「花が水をかけられる」という受動の関係なので、② watered が正解。How often があるため、The flowers are watered ... という平叙文の語順から考える。（訳: その花は夏の間どれくらいの頻度で水をあげればいいですか。）",{core:"疑問詞を使う疑問文の受動態では、〈疑問詞＋be動詞＋S＋過去分詞（＋by A）?〉の語順になる。主語 the flowers と他動詞 water は「花が水をかけられる」という受動の関係なので、② watered が正解。How often があるため、The flowers are watered ... という平叙文の語順から考える。",ex:["What was damaged by the typhoon?","その台風で何が被害を受けましたか。"]}],
[35,"The presidential election (　　) in two years.","will be held","will hold","will held","are hold","助動詞を含む受動態は〈助動詞＋be done〉の語順になる。助動詞の後ろは常に原形の be になる。主語 the presidential election と他動詞 hold は「大統領選挙が行われる」という受動の関係なので、② will be held が正解。（訳: 大統領選挙は２年後に行われる。）",{core:"助動詞を含む受動態は〈助動詞＋be done〉の語順になる。助動詞の後ろは常に原形の be になる。主語 the presidential election と他動詞 hold は「大統領選挙が行われる」という受動の関係なので、② will be held が正解。"}],
[36,"Fortunately, the hospital’s new air-conditioning system (　　) when the first heat wave of the summer arrived.","had already been installed","had already been installing","had already installed","already installed","完了形の受動態は〈have［has / had］ been done〉の語順で、have［has / had］の後ろは常に been になる。主語 the hospital’s new air-conditioning system と他動詞 install は受動の関係。「その夏初めての熱波が襲った」ときよりも前に設置が完了していたため、過去完了の① had already been installed が正解。（訳: その夏初めての熱波が襲ったとき、幸運にもその病院の新しい空調システムはすでに設置されていた。）",{core:"完了形の受動態は〈have［has / had］ been done〉の語順で、have［has / had］の後ろは常に been になる。主語 the hospital’s new air-conditioning system と他動詞 install は受動の関係。「その夏初めての熱波が襲った」ときよりも前に設置が完了していたため、過去完了の① had already been installed が正解。"}],
[37,"It has been hard to concentrate on my studies lately because a road (　　) in front of my house.","is being built","builds","has built","is building","進行形の受動態は〈am / is / are / was / were＋being done〉の語順で、be動詞の後ろは常に being になる。主語 a road と他動詞 build は「道路が建設される」という受動の関係なので、③ is being built が正解。a road is being built は現在進行形の受動態で、道路が建設中であることを表す。（訳: 自宅の前で道路が造られているので、このところずっと、勉強に集中しにくい。）",{core:"進行形の受動態は〈am / is / are / was / were＋being done〉の語順で、be動詞の後ろは常に being になる。主語 a road と他動詞 build は「道路が建設される」という受動の関係なので、③ is being built が正解。a road is being built は現在進行形の受動態で、道路が建設中であることを表す。"}],
[38,"On her way home from school, the little girl was (　　) a stranger.","spoken to by","spoken to","spoke","spoken by to","群動詞の受動態は、〈動詞＋前置詞／副詞〉などを１つの動詞と考える。speak to A「A に話しかける」の受動態は A is spoken to by B となるので、① spoken to by が正解。前置詞 to と by が連続する点に注意。（訳: 学校からの帰宅途中、その幼い少女は見知らぬ人に話しかけられた。）",{core:"群動詞の受動態は、〈動詞＋前置詞／副詞〉などを１つの動詞と考える。speak to A「A に話しかける」の受動態は A is spoken to by B となるので、① spoken to by が正解。前置詞 to と by が連続する点に注意。",plus:"on one’s way home「家に帰る途中」",ex:["This boy should be taken care of by his relatives.","この少年は親戚によって面倒を見られるべきだ。"]}],
[39,"だれも人前で笑いものにされるのは好きではない。 （be / fun / in / likes / made / nobody / of / to）public.","Nobody likes to be made fun of in","Nobody likes to made be fun of in","Nobody likes to be made of fun in","Nobody likes to be fun made of in","「だれも…ない」は主語を nobody で始めて表す。make fun of「…を笑いものにする」、like to do「…することを好む」、in public「人前で」のフレーズを作る。likes のあとに to be made fun of と受動態の不定詞を続ける。群動詞 make fun of を１つの動詞と考え、A make fun of B「A が B をからかう」の受動態は B is made fun of by A とする。（訳: だれも人前で笑いものにされるのは好きではない。）",{core:"「だれも…ない」は主語を nobody で始めて表す。make fun of「…を笑いものにする」、like to do「…することを好む」、in public「人前で」のフレーズを作る。likes のあとに to be made fun of と受動態の不定詞を続ける。群動詞 make fun of を１つの動詞と考え、A make fun of B「A が B をからかう」の受動態は B is made fun of by A とする。",plus:"in public「人前で」"}],

[359,"Is that project worth (　　) at a great expense to the taxpayer?","launching","launch","launched","to launch","worth の後ろには名詞や動名詞が来る。A is worth doing では、主語 A が doing の意味上の目的語になる。（訳: そのプロジェクトは、納税者に多大な負担をかけてまで立ち上げる価値があるのか。）",{core:"worth の後ろには名詞や動名詞が来る。A is worth doing では、主語 A が doing の意味上の目的語になる。",plus:"〈A is worth doing＋前置詞〉の形もある。 ／ 本問では主語 that project が動名詞 launching の意味上の目的語になる。",ex:["The music is worth listening to.","その曲は聞く価値がある。"]}],
[360,"It is worth (　　) the estimated cost of the project.","considering","to consider","in considering","considered","It is worth doing A の形を用いる。（訳: その企画の見積もり額は考慮に値する。）",{core:"It is worth doing A の形を用いる。",plus:"A is worth doing. = It is worth doing A. = It is worthwhile doing A [to do A]. 本問は The estimated cost of the project is worth considering. と書き換えられる。"}],
[361,"Most of the questions are easy, but this particular one is (　　) me.","beyond","over","outside","out of","beyond A は「（難しすぎて）A（人）には理解できない」という意味の慣用表現。原義は「Aの能力を超えている」。（訳: ほとんどの問題は簡単だが、特にこの問題は難しくて私には理解できない［私の能力を超えている］。）",{core:"beyond A は「（難しすぎて）A（人）には理解できない」という意味の慣用表現。原義は「Aの能力を超えている」。"}],
[362,"My stolen bicycle was destroyed (　　) recognition.","beyond","above","below","over","beyond recognition は「見分けがつかないほど／判別できないくらい」の意味。原義は「認識できる範囲を超えている」。（訳: 私の盗まれた自転車は、見分けがつかないほどに壊されていた。）",{core:"beyond recognition は「見分けがつかないほど／判別できないくらい」の意味。原義は「認識できる範囲を超えている」。",ex:["beyond repair / beyond control / beyond belief / beyond description / beyond reach","修理できないほど／制御できないほど／信じられないほど／言葉では表せないほど／手が届かないほど"]}],
[363,"I went fishing (　　) the river.","in","to","for","of","go doing in[at / on など] A では、Aという場所に到着してからその行為をするため、到達点の to ではなく、その行為をする場所を示す前置詞を用いる。（訳: 私は川に釣りに行った。）",{core:"go doing in[at / on など] A では、Aという場所に到着してからその行為をするため、到達点の to ではなく、その行為をする場所を示す前置詞を用いる。",wrongs:[["to","go fishing to the river は「川まで釣りをしながら行く」という不自然な意味になる。"]],ex:["go shopping at the mall / go skating on the lake / go jogging around the Imperial Palace","モールに買い物に行く／湖にスケートに行く／皇居の周りへジョギングしに行く"]}],
[364,"They were close to home now, but David turned (　　) the opposite direction.","in","of","at","to","in A は「A（の方向・方角）へ」という意味を表すことがある。「方向・方角」には to は使えない。（訳: 彼らはもう家の近くまで来ていたが、デイビッドは反対方向に曲がった。）",{core:"in A は「A（の方向・方角）へ」という意味を表すことがある。「方向・方角」には to は使えない。",ex:["go in the right direction / The sun rises in the east and sets in the west.","正しい方向へ進む／太陽は東から昇り、西に沈む。"]}],
[365,"I went skiing for the first time (　　) fifteen years.","in","before","during","of","for the first time in fifteen years は「15年間の中で初めて」から「15年ぶり」の意味になる。（訳: 私は15年ぶりにスキーに行った。）",{core:"for the first time in fifteen years は「15年間の中で初めて」から「15年ぶり」の意味になる。"}],
[366,"(　　) my surprise, she didn't come to their wedding party.","To","At","By","With","〈to A's＋感情を表す名詞〉は「Aが…したことには」という、結果として抱いた感情を表す。（訳: 驚いたことに、彼女は彼らの結婚パーティーに来なかった。）",{core:"〈to A's＋感情を表す名詞〉は「Aが…したことには」という、結果として抱いた感情を表す。",ex:["to his great delight / to the disappointment of my parents","彼がとても喜んだことに／私の両親ががっかりしたことに"]}],
[367,"We danced (　　) the music.","to","by","of","in","to A は「A（音）に合わせて」という意味を表すことがある。（訳: 私たちは音楽に合わせて踊った。）",{core:"to A は「A（音）に合わせて」という意味を表すことがある。"}],
[368,"The President said that it was (　　) great importance to develop the US-China constructive partnership.","of","a","such","with","〈of＋抽象名詞〉は形容詞と同じ働きをする。of (great) importance は (very) important と同意。（訳: 米中の建設的な協調関係を進展させることが非常に重要であると、大統領は述べた。）",{core:"〈of＋抽象名詞〉は形容詞と同じ働きをする。of (great) importance は (very) important と同意。",plus:"抽象名詞の前に great / a little / little / no などが入ることがある。",ex:["of use / of help / of value","役立つ／役立つ／価値のある"]}],
[369,"The dog jumped over the fence (　　) ease.","with","in","at","by","〈with＋抽象名詞〉は副詞と同じ働きをし、原則として動詞を修飾する。with ease は easily と同意。（訳: その犬は簡単に柵を飛び越えた。）",{core:"〈with＋抽象名詞〉は副詞と同じ働きをし、原則として動詞を修飾する。with ease は easily と同意。",ex:["with care / with kindness / with fluency / with difficulty / with pleasure","注意深く／親切に／流暢に／苦労して／喜んで"]}],
[370,"I get paid (　　) the hour.","by","at","for","in","販売や支払いの基準となる単位は〈by the＋単位〉で表す。定冠詞 the をつける。（訳: 私は時間給で支払われる。）",{core:"販売や支払いの基準となる単位は〈by the＋単位〉で表す。定冠詞 the をつける。",ex:["sell meat by the kilo","肉をキロ単位で販売する"]}],
[371,"The mother caught her baby (　　) when he fell forward.","by the arm","with his arm","to his arm","of the arm","身体や衣服の一部に触れる場合、まず相手を述べ、その後に〈前置詞＋the＋身体・衣服の部位〉を置く。身体部位には所有格ではなく the を用いる。（訳: 赤ちゃんが前に倒れこんだとき、母親はその子の腕をつかんだ。）",{core:"身体や衣服の一部に触れる場合、まず相手を述べ、その後に〈前置詞＋the＋身体・衣服の部位〉を置く。身体部位には所有格ではなく the を用いる。",ex:["catch me by the arm / slap him in the face / touch you on the shoulder","私の腕をつかむ／彼の顔をひっぱたく／君の肩に触れる"]}],
[372,"コーチは私の肩をポンと叩きながら、励ましてくれた。（1語不要） The coach encouraged me, (shoulder / patting / on / the / my / me).","patting me on the shoulder","patting on me the shoulder","patting the shoulder on me","me patting on the shoulder","身体や衣服の部位には the を用いるので、patting me on the shoulder とする。問題中の my は不要。（訳: コーチは私の肩をポンと叩きながら、励ましてくれた。）",{core:"身体や衣服の部位には the を用いるので、patting me on the shoulder とする。問題中の my は不要。"}],
[373,"必ず彼の目を見て話しなさい。さもないと、正直に話していないと思われてしまう。 Be sure to (him / in / look / talking / the eye / while), or he might think you are not being honest.","look him in the eye while talking","look at him in the eye while talking","look him on the eye while talking","look him in the eye while being talk","look him in the eye とする。この look は他動詞なので look at him in the eye とはしない。while talking は while you are talking の you are が省略された形。（訳: 必ず彼の目を見て話しなさい。さもないと、正直に話していないと思われてしまう。）",{core:"look him in the eye とする。この look は他動詞なので look at him in the eye とはしない。while talking は while you are talking の you are が省略された形。",plus:"be動詞の進行形には一時性を強調する用法がある。you are not being honest は「今に限って正直でない＝嘘を言っている」の意味。 ／ be sure to do「必ず…する」"}],
[431,"Both he and I (　　) to go to China.","are","am","be","is","Both he and I は複数扱い。正解の are to go は〈be動詞＋to do〉を用いた表現で、「予定・運命」の意味。（訳: 彼も私も中国に行く予定だ。）",{core:"Both he and I は複数扱い。正解の are to go は〈be動詞＋to do〉を用いた表現で、「予定・運命」の意味。"}],
[432,"Not only Larry and David but also Peter (　　) come to the airport to see me off.","has","have","is","are","主語の not only A but (also) B は B に動詞を一致させる。B に相当するのは三人称単数の Peter なので、述語動詞は①の現在完了の has come となる。（訳: ラリーとデイビッドだけでなく、ピーターも私を見送りに空港に来てくれている。）",{core:"主語の not only A but (also) B は B に動詞を一致させる。B に相当するのは三人称単数の Peter なので、述語動詞は①の現在完了の has come となる。"}],
[433,"Neither my friend nor her brothers (　　) our wedding.","are attending","attends","doesn't attend","is attending","主語の neither A nor B は B に動詞を一致させる。B に相当するのは her brothers という複数名詞なので、① are attending が正解。（訳: 私の友人も彼女の兄弟も私たちの結婚式に出ない予定だ。）",{core:"主語の neither A nor B は B に動詞を一致させる。B に相当するのは her brothers という複数名詞なので、① are attending が正解。"}],
[434,"Either she or I (　　) to go.","am","is","can","may","主語の either A or B は B に動詞を一致させる。B に相当するのは一人称単数の I なので、① am が正解。正解の am to go は〈be動詞＋to do〉を用いた表現で、「予定・運命」の意味。（訳: 彼女か私のどちらかが行くことになるだろう。）",{core:"主語の either A or B は B に動詞を一致させる。B に相当するのは一人称単数の I なので、① am が正解。正解の am to go は〈be動詞＋to do〉を用いた表現で、「予定・運命」の意味。"}],
[435,"Mr. Tanaka, as ①well as you, ②were transferred ③to ④the Sales Promotion Department.（誤っている箇所を選ぶ）","were transferred","well","to","the","誤っている箇所は ②were transferred。訂正：were transferred → was transferred。主語の A as well as B は A に動詞を一致させる。A に相当するのは三人称単数の Mr. Tanaka なので、述語動詞② were を was に訂正する。（訳: あなただけでなく田中さんも販売促進部に異動になった。）",{core:"誤っている箇所は ②were transferred。訂正：were transferred → was transferred。主語の A as well as B は A に動詞を一致させる。A に相当するのは三人称単数の Mr. Tanaka なので、述語動詞② were を was に訂正する。",plus:"transfer A to B「AをBに移す」 → A is transferred to B「AはBに移される／AはBに異動になる」"}],
[436,"Most of the students here (　　) with their families.","live","living","lives","is living","主語になっている most of A の A に相当するのは三人称複数の the students なので、述語動詞は① live を用いるのが正しい。（訳: ここの学生たちのほとんどは家族と一緒に暮らしている。）",{core:"主語になっている most of A の A に相当するのは三人称複数の the students なので、述語動詞は① live を用いるのが正しい。"}],
[437,"Three fifths of the work (　　) finished.","was","had","were","would","主語になっている〈分数＋of A〉の A に相当するのは三人称単数の the work。② was が正解。（訳: その仕事の5分の3は終わった。）",{core:"主語になっている〈分数＋of A〉の A に相当するのは三人称単数の the work。② was が正解。"}],
[438,"①Only 20% of electric cables ②is buried ③beneath the streets in Tokyo, ④compared with 100% in London and Paris.（誤っている箇所を選ぶ）","is buried","Only 20% of electric cables","beneath the streets","compared with","誤っている箇所は ②is buried。訂正：is buried → are buried。主語になっている〈割合／分数＋of A〉の A に相当するのは複数名詞の electric cables なので、述語動詞② is を are に訂正する。（訳: ロンドンやパリが100%であるのに比べて、東京で地中に埋設されている電線は20%にすぎない。）",{core:"誤っている箇所は ②is buried。訂正：is buried → are buried。主語になっている〈割合／分数＋of A〉の A に相当するのは複数名詞の electric cables なので、述語動詞② is を are に訂正する。",plus:"bury「…を埋める」／compared with A「Aと比べて」"}],
[439,"Since the beginning of the twentieth century, there (　　) many political and social changes in Africa.","have been","are","are being","has been","There＋be動詞＋A「Aが存在する／ある／いる」の表現は A が主語。よって be動詞は A に一致させる。主語は複数名詞 many political and social changes であり、since「…以来」を用いていることから、現在完了の① have been が正解。（訳: 20世紀初頭から、アフリカでは多くの政治的、社会的変化があった。）",{core:"There＋be動詞＋A「Aが存在する／ある／いる」の表現は A が主語。よって be動詞は A に一致させる。主語は複数名詞 many political and social changes であり、since「…以来」を用いていることから、現在完了の① have been が正解。"}],
[440,"The larger a ①market is, the ②more competition there ③are in ④that market.（誤っている箇所を選ぶ）","are","market","more","that","誤っている箇所は ③are。訂正：are → is。本問は〈the＋比較級 ..., the＋比較級 ...〉「…すればするほど、ますます～」を用いている。A market is large. と There is much competition in that market. の2つの文を前提にすると、2つ目の文の主語 much competition は不可算名詞で単数扱いなので、③ are を is に訂正する。（訳: 市場が拡大すれば、それだけその市場における競争が増える。）",{core:"誤っている箇所は ③are。訂正：are → is。本問は〈the＋比較級 ..., the＋比較級 ...〉「…すればするほど、ますます～」を用いている。A market is large. と There is much competition in that market. の2つの文を前提にすると、2つ目の文の主語 much competition は不可算名詞で単数扱いなので、③ are を is に訂正する。"}],
[441,"The number of students who wish to continue their studies after they finish their four-year program at Meiji University (　　) increasing.","is","have","has","are","主語を関係代名詞節が修飾し、主語と述語動詞の距離が離れているのでわかりにくい。関係代名詞節 who wish to ... at Meiji University を取り除いて構造を見ると、the number of students が主語。the number of students が主語なので単数扱いになり、① is が正解。（訳: 明治大学での4年間の課程を終えたあとも勉強を続けたいと思う学生の数は増えている。）",{core:"主語を関係代名詞節が修飾し、主語と述語動詞の距離が離れているのでわかりにくい。関係代名詞節 who wish to ... at Meiji University を取り除いて構造を見ると、the number of students が主語。the number of students が主語なので単数扱いになり、① is が正解。"}],
[442,"A number of people (　　) invited to the party.","were","was","have","had","a number of people が主語なので複数扱いになる。よって② were が正解。a number of A の A には複数名詞が来るが、動詞はその A に一致させるので複数扱いになる。（訳: たくさんの人々がそのパーティーに招待された。）",{core:"a number of people が主語なので複数扱いになる。よって② were が正解。a number of A の A には複数名詞が来るが、動詞はその A に一致させるので複数扱いになる。"}],
[443,"The United Nations (　　) established after World War II.","was","were","was being","have been","the United Nations は多くの国々で構成された1つの団体なので、単数扱いとなる。（訳: 国連は第二次世界大戦後に設立された。）",{core:"the United Nations は多くの国々で構成された1つの団体なので、単数扱いとなる。"}],
[444,"Fifty minutes (　　) to finish this test.","isn't enough time","aren't enough time","isn't enough times","aren't enough times","「時間、年齢、距離、金額、重量」などを表す語句は1つのまとまりとみなすので、単数扱いが原則。主語 fifty minutes は時間を表す語句で1つのまとまりとみなすため、単数扱いとなる。（訳: 50分はこのテストを終えるのに十分な時間ではない。）",{core:"「時間、年齢、距離、金額、重量」などを表す語句は1つのまとまりとみなすので、単数扱いが原則。主語 fifty minutes は時間を表す語句で1つのまとまりとみなすため、単数扱いとなる。",wrongs:[["isn't enough times","「時間」を表す time は不可算名詞なので、times となっている③は不可。"],["aren't enough times","「時間」を表す time は不可算名詞なので、times となっている④は不可。"]],ex:["Fifty miles is a long distance.","50マイルは長距離だ。"]}],

/* ================= 状態 ================= */
const QN=8, TIME_MS=12000;
let S={bestSurv:0,streakDays:0,lastDay:"",total:0,correct:0,word:{},sound:true,tone:"piano",name:"",askedName:false,perfects:0,range:null};
const $=id=>document.getElementById(id);

async function storeGet(k){
  if(window.storage){const r=await window.storage.get(k);return r?r.value:null;}
  try{return localStorage.getItem(k);}catch(e){return null;}
}
async function storeSet(k,v){
  if(window.storage)return window.storage.set(k,v);
  try{localStorage.setItem(k,v);}catch(e){}
}
async function loadState(){
  try{
    const v=await storeGet("wordrush_vintage");
    if(v)S={...S,...JSON.parse(v)};
  }catch(e){}
  renderHome();
  if(!S.name&&!S.askedName){S.askedName=true;saveState();askName(true);}
}
async function saveState(){
  try{ await storeSet("wordrush_vintage",JSON.stringify(S)); }catch(e){}
}

/* ================= サウンド(音階は据え置き) ================= */
const SCALE=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5,
             1174.66,1318.5,1396.9,1568,1760,1975.5,2093];
const TONES={piano:"ピアノ",clar:"クラリネット",bari:"バリトンサックス",mbox:"オルゴール",bit:"8bit"};
let AC=null;
function ctx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function playNote(freq,tone,delay=0,vol=1){
  if(!S.sound)return;
  try{
    const ac=ctx(),t=ac.currentTime+delay;
    const out=ac.createGain();out.connect(ac.destination);
    const env=(g,a,peak,dec)=>{
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(peak*vol,t+a);
      g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    };
    let dur=1;
    if(tone==="piano"){
      [[1,"triangle",.16],[2,"sine",.05],[3,"sine",.02]].forEach(([m,w,p])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type=w;o.frequency.value=freq*m;
        env(g,.004,p,.862);
        o.connect(g).connect(out);o.start(t);o.stop(t+.9);
      });
      dur=.9;
    }else if(tone==="mbox"){
      [[1,.14,1.3],[4,.05,.45],[5.4,.02,.3]].forEach(([m,p,d])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type="sine";o.frequency.value=freq*m;
        env(g,.002,p,d);
        o.connect(g).connect(out);o.start(t);o.stop(t+d+.05);
      });
      dur=1.3;
    }else if(tone==="clar"){
      const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
      o.type="square";o.frequency.value=freq/2;
      f.type="lowpass";f.frequency.value=freq*1.8;f.Q.value=.8;
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(.09*vol,t+.05);
      g.gain.setValueAtTime(.09*vol,t+.22);
      g.gain.exponentialRampToValueAtTime(.0001,t+.38);
      o.connect(f).connect(g).connect(out);o.start(t);o.stop(t+.4);
      dur=.4;
    }else if(tone==="bari"){
      [0,-7].forEach(cents=>{
        const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
        o.type="sawtooth";o.frequency.value=(freq/4)*Math.pow(2,cents/1200);
        f.type="lowpass";f.frequency.value=freq*1.1;f.Q.value=1;
        g.gain.setValueAtTime(.0001,t);
        g.gain.linearRampToValueAtTime(.07*vol,t+.06);
        g.gain.setValueAtTime(.07*vol,t+.24);
        g.gain.exponentialRampToValueAtTime(.0001,t+.42);
        o.connect(f).connect(g).connect(out);o.start(t);o.stop(t+.45);
      });
      dur=.45;
    }else{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="square";o.frequency.value=freq;
      g.gain.setValueAtTime(.06*vol,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+.12);
      o.connect(g).connect(out);o.start(t);o.stop(t+.13);
      dur=.13;
    }
    setTimeout(()=>out.disconnect(),(delay+dur+.2)*1000);
  }catch(e){}
}
function playChord(freqs,tone,delay=0,vol=.6){freqs.forEach(f=>playNote(f,tone,delay,vol));}
function beep(freq,dur=.09,type="square",gain=.06){
  if(!S.sound)return;
  try{
    const ac=ctx();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(gain,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
const sfx={
  ok:c=>{ /* 連続正解数で音階を登る(表示はしない) */
    const i=Math.min(Math.max(c-1,0),SCALE.length-1);
    playNote(SCALE[i],S.tone);
    if(c===8)playChord([523.25,659.25,783.99],S.tone,0,.4);
  },
  ng:()=>beep(160,.18,"sawtooth",.05),
  tick:()=>beep(880,.04,"sine",.03),
  fanfare:()=>{
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>playNote(f,S.tone,i*.13));
    playChord([523.25,659.25,783.99,1046.5],S.tone,.55,.5);
  },
  preview:tone=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>playNote(f,tone,i*.16));}
};

/* ================= 出題 ================= */
function dataLo(){return Math.min(...QUESTIONS.map(q=>q[0]));}
function dataHi(){return Math.max(...QUESTIONS.map(q=>q[0]));}
function activeRange(){
  const lo=dataLo(),hi=dataHi();
  if(!S.range)return {lo,hi};
  return {lo:Math.max(lo,S.range.lo),hi:Math.min(hi,S.range.hi)};
}
function rangeCount(){const R=activeRange();return QUESTIONS.filter(q=>q[0]>=R.lo&&q[0]<=R.hi).length;}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function keyOf(q){return "q"+q[0];}
function correctDays(st){return st&&st.okDays?st.okDays.length:0;}
/* 全問が定着モード: 別々の3日に正解して初めてMASTER */
function isMastered(k){const st=S.word[k];if(!st)return false;return correctDays(st)>=3;}
/* 軽量SRS: MASTER済み かつ 当日すでに正解した問題は、その日もう出さない */
function isRestingToday(k){const st=S.word[k];return !!(st&&isMastered(k)&&st.okDay===todayStr());}
function eligiblePool(){const R=activeRange();return QUESTIONS.filter(q=>q[0]>=R.lo&&q[0]<=R.hi&&!isRestingToday(keyOf(q)));}
function pickQs(reviewOnly,count){
  const R=activeRange();
  let inRange=QUESTIONS.map(q=>({num:q[0],text:q[1],ans:q[2],wrongs:[q[3],q[4],q[5]],expl:q[6],rich:q[7]||null,key:keyOf(q)}))
                       .filter(q=>q.num>=R.lo&&q.num<=R.hi);
  inRange=inRange.filter(q=>!isRestingToday(q.key));
  let pool=inRange;
  if(reviewOnly)pool=pool.filter(q=>{const st=S.word[q.key];return st&&st.wrong>st.right;});
  if(!pool.length)pool=inRange.length?inRange:QUESTIONS.map(q=>({num:q[0],text:q[1],ans:q[2],wrongs:[q[3],q[4],q[5]],expl:q[6],rich:q[7]||null,key:keyOf(q)}));
  const weight=q=>{
    const st=S.word[q.key]||{};
    return Math.max(.1, 1+(st.wrong||0)*3-Math.min((st.right||0)*.3,.8));
  };
  const picked=[],bag=[...pool];
  while(picked.length<count&&bag.length){
    const tot=bag.reduce((s,q)=>s+weight(q),0);
    let r=Math.random()*tot;
    for(let k=0;k<bag.length;k++){
      r-=weight(bag[k]);
      if(r<=0){picked.push(bag.splice(k,1)[0]);break;}
    }
  }
  while(picked.length<count)picked.push(pool[Math.floor(Math.random()*pool.length)]);
  return picked;
}
/* 選択肢は問題ごとに固定(他問から拾わない) */
function makeChoices(q){
  return [q.ans,...q.wrongs].sort(()=>Math.random()-.5);
}
/* 【指示】部分を色分けして表示 */
function renderQuestionText(text){
  const m=text.match(/^【(.+?)】(.*)$/);
  if(m)return `<span class="lead">【${m[1]}】</span>${m[2]}`;
  return text;
}

/* ================= ゲーム進行 ================= */
let G=null,timerId=null,tickId=null,pendingNext=null;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");}

function startGame(mode){
  hideCelebrate();
  if(mode!=="review" && eligiblePool().length===0){ showDoneToday(); return; }
  const count=mode==="survival"?eligiblePool().length:QN;
  G={mode,qs:pickQs(mode==="review",count),idx:0,combo:0,ok:0,wrongList:[],lives:3};
  $("lives").textContent=mode==="survival"?"❤️❤️❤️":"";
  show("quiz");nextQ();
}
function showDoneToday(){
  const d=document.createElement("div");
  d.innerHTML="🎉 今日のぶんは完了！<br>また明日ね";
  d.style.cssText="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;background:var(--card);color:var(--ink);padding:20px 24px;border-radius:16px;font-weight:800;font-size:16px;line-height:1.6;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);border:1px solid #3a3270;max-width:80%";
  document.body.appendChild(d);
  setTimeout(()=>{d.style.transition="opacity .4s";d.style.opacity="0";},2400);
  setTimeout(()=>d.remove(),2900);
}
function curTime(){
  if(G.mode!=="survival")return TIME_MS;
  return Math.max(6000, TIME_MS - G.idx*200);
}
function nextQ(){
  clearTimeout(timerId);clearInterval(tickId);
  const isOver = G.mode==="survival" ? (G.lives<=0||G.idx>=G.qs.length) : (G.idx>=QN);
  if(isOver)return endGame();
  const q=G.qs[G.idx];
  $("qnum").textContent=G.mode==="survival"?`Q${G.idx+1}`:`Q${G.idx+1} / ${QN}`;
  $("qword").innerHTML=renderQuestionText(q.text);
  const cs=makeChoices(q);
  $("choices").innerHTML="";
  cs.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<span class="key">${i+1}</span><span>${c}</span>`;
    b.dataset.ans=c;
    b.onclick=()=>answer(b,c===q.ans,q);
    $("choices").appendChild(b);
  });
  const f=$("timerfill"),tm=curTime();
  f.style.transition="none";f.style.width="100%";
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    f.style.transition=`width ${tm}ms linear`;f.style.width="0%";
  });});
  G.qStart=Date.now();G.qTime=tm;
  timerId=setTimeout(()=>answer(null,false,q),tm);
  tickId=setInterval(()=>{ if(Date.now()-G.qStart>G.qTime-2000) sfx.tick(); },500);
}
function answer(btn,ok,q){
  clearTimeout(timerId);clearInterval(tickId);
  document.querySelectorAll(".choice").forEach(b=>{
    b.onclick=null;
    if(b.dataset.ans===q.ans)b.classList.add("correct");
    else if(b!==btn)b.classList.add("dim");
  });
  const st=S.word[q.key]=S.word[q.key]||{right:0,wrong:0};
  S.total++;
  if(ok){
    S.correct++;st.right++;
    {const t=todayStr();st.okDay=t;if(!st.okDays)st.okDays=[];if(!st.okDays.includes(t))st.okDays.push(t);}
    G.ok++;G.combo++;
    sfx.ok(G.combo);
    G.idx++;
    setTimeout(nextQ,550);
  }else{
    st.wrong++;
    if(btn)btn.classList.add("wrong");
    G.combo=0;
    G.wrongList.push(q);
    if(G.mode==="survival"){
      G.lives--;
      $("lives").textContent="❤️".repeat(G.lives)+"🖤".repeat(3-G.lives);
    }
    sfx.ng();
    G.idx++;
    setTimeout(()=>showExpl(q),600);
  }
}
/* 間違えたときだけ解説 → タップで次へ */
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function showExpl(q){
  $("explAns").textContent="正解: "+q.ans;
  const r=q.rich;
  if(r){
    let h="";
    if(r.core)h+=`<div>${esc(r.core)}</div>`;
    if(r.wrongs&&r.wrongs.length){
      h+=`<div class="exp-sec"><h5>なぜ他はダメか</h5>`;
      r.wrongs.forEach(w=>{
        h+=`<div class="exp-wrong"><span class="wc">${esc(w[0])}</span><span class="wt">${esc(w[1])}</span></div>`;
      });
      h+=`</div>`;
    }
    if(r.plus){
      h+=`<div class="exp-plus"><span class="pl">＋α</span>${esc(r.plus)}`;
      if(r.ex)h+=`<div class="exp-ex"><span class="en">${esc(r.ex[0])}</span><br><span class="ja">${esc(r.ex[1])}</span></div>`;
      h+=`</div>`;
    }else if(r.ex){
      h+=`<div class="exp-ex"><span class="en">${esc(r.ex[0])}</span><br><span class="ja">${esc(r.ex[1])}</span></div>`;
    }
    $("explBody").innerHTML=h;
  }else{
    $("explBody").textContent=q.expl||"";
  }
  $("expl").style.display="flex";
  pendingNext=()=>{ $("expl").style.display="none"; pendingNext=null; nextQ(); };
}
$("expl").addEventListener("click",()=>{ if(pendingNext)pendingNext(); });

const PRAISES=["すごい！","天才！","神！","最高！","完璧！","さすが！","よくやった！","素晴らしい！",
  "やるね！","パーフェクト！","ブラボー！","AMAZING!","GENIUS!","PERFECT!","WONDERFUL!","BRAVO!",
  "GREAT!","花マル！","100点！","えらい！","きらきら✨","NICE!","超人！","脱帽！","圧巻！","お見事！"];
let celebrating=false;
function praiseStorm(){
  const cel=$("celebrate");
  const cols=["#fff","#FFD75E","#FF5BA8","#6FD6FF","#5EE6A8","#FFE9A8","#C9A0FF"];
  const nm=(S.name?S.name+"ちゃん、":"あなた、");

  for(let i=0;i<total;i++){
    setTimeout(()=>{

      const el=document.createElement("div");
      el.className="praise-word";

      el.style.color=cols[Math.floor(Math.random()*cols.length)];

      el.style.left=(Math.random()*78)+"vw";
      el.style.top=(Math.random()*86)+"vh";

      cel.appendChild(el);
      el.animate([
        {opacity:0,transform:`scale(.4) rotate(${rot}deg)`},
        {opacity:1,transform:`scale(1.1) rotate(${rot}deg)`,offset:.22},
        {opacity:1,transform:`scale(1) rotate(${rot}deg)`,offset:.78},
        {opacity:0,transform:`scale(1.04) rotate(${rot}deg) translateY(-18px)`}
      ],{duration:1800,easing:"cubic-bezier(.2,1.4,.4,1)",fill:"forwards"});
      setTimeout(()=>el.remove(),1840);
      if(S.sound&&i%3===0){const f=[660,740,880,990][i%4];playNote(f,S.tone,0,.5);}
    }, i*130);

}
function hideCelebrate(){
  celebrating=false;
  const c=$("celebrate");
  c.style.display="none";
  $("arashiBg").classList.remove("go");
  $("flash").classList.remove("go");
  c.querySelectorAll(".praise-word").forEach(e=>e.remove());
  document.querySelectorAll(".confetti").forEach(e=>e.remove());
}
function celebratePerfect(){
  const cel=$("celebrate");
  celebrating=true;
  cel.style.display="block";
  ["arashiBg","flash"].forEach(id=>{const e=$(id);e.classList.remove("go");void e.offsetWidth;});
  $("arashiBg").classList.add("go");
  $("flash").classList.add("go");
  praiseStorm();
  burstConfetti(30);
  sfx.fanfare();
  if(navigator.vibrate)try{navigator.vibrate([0,30,30,30,30,30,30,90]);}catch(e){}
  setTimeout(hideCelebrate,3500);
}
function burstConfetti(n){
  const colors=["#6FD6FF","#FFC53D","#FF7A45","#FF3D8A","#5EE6A8"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.2+Math.random())+"s";
    c.style.borderRadius=Math.random()>.5?"50%":"2px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2400);
  }
}

async function endGame(){
  const t=todayStr();
  if(S.lastDay!==t){
    const y=new Date(Date.now()-864e5);
    const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
    S.streakDays=(S.lastDay===ys)?S.streakDays+1:1;
    S.lastDay=t;
  }
  let newBest=false;
  if(G.mode==="survival"&&G.ok>S.bestSurv){S.bestSurv=G.ok;newBest=true;}
  let praise="";
  const nm=S.name?S.name+"ちゃん":"";
  let doCelebrate=false;
  if(G.mode!=="survival"&&G.ok===QN){
    S.perfects=(S.perfects||0)+1;
    praise=(nm?nm+"、":"")+"全問正解!オクターブ完成🎵";
    doCelebrate=true;
  }else if(newBest){
    praise="新記録!";
  }
  await saveState();

  $("praise").textContent=praise;
  $("praise").style.display=praise?"block":"none";
  if(doCelebrate)setTimeout(celebratePerfect,120);
  $("resMode").textContent=G.mode==="survival"?"SURVIVAL RESULT":G.mode==="review"?"REVIEW RESULT":"SPRINT RESULT";
  $("resScore").textContent=G.mode==="survival"?`${G.ok}問`:`${G.ok} / ${QN}`;
  $("resBest").textContent=newBest?"🏆 サバイバル記録更新!":"";
  const box=$("resWrong"),list=$("resWrongList");
  if(G.wrongList.length){
    box.style.display="block";
    list.innerHTML=G.wrongList.map(q=>`<div class="w"><b>${q.text}</b><span>正解: ${q.ans}</span></div>`).join("");
  }else box.style.display="none";
  show("result");
}

/* ================= ホーム & 図鑑 ================= */
function zukanProgress(){
  const R=activeRange();
  let p=0;
  QUESTIONS.forEach(q=>{
    if(q[0]<R.lo||q[0]>R.hi)return;
    const k=keyOf(q),st=S.word[k];if(!st)return;
    if((st.right||0)+(st.wrong||0)===0)return;
    p+=isMastered(k)?1:0.5;
  });
  return p;
}
function renderHome(){
  $("stSurv").textContent=S.bestSurv;
  $("stStreak").textContent=S.streakDays;
  $("stAcc").textContent=S.total?Math.round(S.correct/S.total*100)+"%":"-%";
  const R=activeRange();
  const rc=rangeCount();
  const weak=QUESTIONS.filter(q=>{if(q[0]<R.lo||q[0]>R.hi)return false;const v=S.word[keyOf(q)];return v&&v.wrong>v.right;}).length;
  $("weakCount").textContent=weak;
  $("reviewBadge").style.display=weak>=3?"block":"none";
  $("reviewBtn").style.display=weak>=3?"block":"none";
  $("zukanRate").textContent=(rc?Math.round(zukanProgress()/rc*100):0)+"%";
  if(document.activeElement!==$("rangeLo"))$("rangeLo").value=R.lo;
  if(document.activeElement!==$("rangeHi"))$("rangeHi").value=R.hi;
  $("rangeNow").textContent=`いまの範囲: ${R.lo}〜${R.hi}（${rc}問）`;
  $("sndToggle").textContent=S.sound?"🔊":"🔇";
  $("nameBtn").textContent=S.name?`ようこそ、${S.name}ちゃん 🎵`:"✏️ なまえを設定";
  const tc=$("toneChips");tc.innerHTML="";
  Object.entries(TONES).forEach(([k,name])=>{
    const b=document.createElement("button");
    b.className="chip"+(S.tone===k?" sel":"");
    b.textContent=name;
    b.onclick=()=>{S.tone=k;saveState();renderHome();sfx.preview(k);};
    tc.appendChild(b);
  });
}
function renderZukan(){
  const R=activeRange();
  const rc=rangeCount();
  const prog=zukanProgress();
  const pct=rc?Math.round(prog/rc*100):0;
  $("zukanPct").textContent=`${pct}%（${R.lo}〜${R.hi}）`;
  $("zfill").style.width=(rc?prog/rc*100:0)+"%";
  const zl=$("zlist");zl.innerHTML="";
  QUESTIONS.forEach(q=>{
    if(q[0]<R.lo||q[0]>R.hi)return;
    const k=keyOf(q),st=S.word[k];
    const d=document.createElement("div");
    let tag="",locked=false;
    if(!st||st.right+st.wrong===0){locked=true;}
    else if(isMastered(k))tag=`<span class="tag m">★ MASTER</span>`;
    else if(st.wrong>st.right)tag=`<span class="tag w">⚡ 苦手</span>`;
    else tag=`<span class="tag t">挑戦中</span>`;
    d.className="zw"+(locked?" locked":"");
    d.innerHTML=`<div class="ztop"><span class="znum">${q[0]}</span><span class="zq">${locked?"???":renderQuestionText(q[1])}${tag}</span></div>`
      +(locked?"":`<div class="zans">正解: ${q[2]}</div>`);
    zl.appendChild(d);
  });
}

/* ================= イベント ================= */
$("startBtn").onclick=()=>startGame("sprint");
$("survBtn").onclick=()=>startGame("survival");
$("reviewBtn").onclick=()=>startGame("review");
$("rangeSet").onclick=()=>{
  const dlo=dataLo(),dhi=dataHi();
  let lo=parseInt($("rangeLo").value,10),hi=parseInt($("rangeHi").value,10);
  if(isNaN(lo))lo=dlo; if(isNaN(hi))hi=dhi;
  if(lo>hi){const t=lo;lo=hi;hi=t;}
  lo=Math.max(dlo,Math.min(lo,dhi)); hi=Math.max(dlo,Math.min(hi,dhi));
  S.range=(lo===dlo&&hi===dhi)?null:{lo,hi};
  saveState();renderHome();
};
$("rangeAll").onclick=()=>{S.range=null;saveState();renderHome();};
$("reviewBadge").onclick=()=>startGame("review");
$("againBtn").onclick=()=>startGame(G?G.mode:"sprint");
$("homeBtn").onclick=()=>{hideCelebrate();renderHome();show("home");};
$("zukanBtn").onclick=()=>{renderZukan();show("zukan");};
$("zukanBack").onclick=()=>{renderHome();show("home");};
$("sndToggle").onclick=()=>{S.sound=!S.sound;$("sndToggle").textContent=S.sound?"🔊":"🔇";saveState();};
function askName(first){
  $("nameInput").value=S.name||"";
  $("nameSkip").textContent=first?"あとで":"キャンセル";
  $("nameModal").style.display="flex";
  setTimeout(()=>$("nameInput").focus(),100);
}
$("nameBtn").onclick=()=>askName(false);
$("nameOk").onclick=()=>{
  S.name=$("nameInput").value.trim().slice(0,10);
  $("nameModal").style.display="none";
  saveState();renderHome();
};
$("nameSkip").onclick=()=>{$("nameModal").style.display="none";};
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("nameOk").click();});
document.addEventListener("keydown",e=>{
  if($("nameModal").style.display==="flex")return;
  if($("expl").style.display==="flex"){if(pendingNext)pendingNext();return;}
  if(!$("quiz").classList.contains("active"))return;
  const n=parseInt(e.key);
  if(n>=1&&n<=4){const b=$("choices").children[n-1];if(b&&b.onclick)b.click();}
});

loadState();
</script>
