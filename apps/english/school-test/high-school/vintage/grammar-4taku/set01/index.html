<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vintage 学校テスト対策 Section 219</title>
<style>
  :root{
    --teal:#00a6b8;
    --teal-dark:#067f8d;
    --cream:#fff3cf;
    --line:#d29418;
    --word:#a34817;
    --text:#202020;
    --ok:#12a85f;
    --bad:#d34b42;
    --bg:#f4f5ef;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text)}
  button{font-family:inherit}
  .app{min-height:100svh;display:flex;flex-direction:column;background:var(--card);max-width:920px;margin:0 auto;box-shadow:0 0 26px rgba(0,0,0,.09)}
  header{background:var(--teal);color:white;min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px 12px 28px;font-weight:850;letter-spacing:.03em}
  .title{font-size:clamp(20px,4.5vw,30px);line-height:1.2}
  .sub{display:block;font-size:.58em;font-weight:700;opacity:.9;margin-top:2px;letter-spacing:0}
  .counter{background:#087989;border-radius:999px;padding:9px 16px;font-size:clamp(17px,4vw,23px);min-width:92px;text-align:center;white-space:nowrap}
  main{flex:1;padding:30px 30px 22px;display:flex;flex-direction:column;gap:18px}
  .qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#526064;font-weight:800}
  .badge{background:#e8fbfd;color:var(--teal-dark);border:1px solid #bcecf2;border-radius:999px;padding:7px 12px;font-size:15px}
  .score{font-size:15px;color:#617174}
  .qbox{min-height:150px;border:1px solid #ece6d8;background:#fffdf6;border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;justify-content:center}
  .en{font-size:clamp(23px,5vw,38px);line-height:1.42;margin:0 0 10px;font-weight:760;letter-spacing:.005em}
  .ja{font-size:clamp(17px,3.7vw,27px);line-height:1.48;color:#333;margin:0}
  .blank{display:inline-block;min-width:70px;text-align:center}
  .choices{display:grid;gap:14px;margin-top:0}
  .choice{width:100%;border:0;border-bottom:4px solid var(--line);background:var(--cream);border-radius:10px;min-height:72px;font-size:clamp(24px,5vw,40px);color:var(--word);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s transform,.12s background,.12s opacity;font-weight:700;padding:10px 12px;text-align:center;box-shadow:0 2px 9px rgba(0,0,0,.05)}
  .choice:active{transform:scale(.987)}
  .choice:disabled{cursor:default}
  .choice.correct{background:#e5f8ed;border-bottom-color:var(--ok);color:#0f7d43}
  .choice.wrong{background:#fde9e5;border-bottom-color:var(--bad);color:#b62929}
  .choice.dim{opacity:.42}
  .feedback{min-height:46px;font-size:clamp(19px,4.5vw,26px);font-weight:850;text-align:center;display:flex;align-items:center;justify-content:center;padding:2px 4px}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .bottom{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 24px 24px}
  .btn{border:0;border-radius:999px;background:var(--teal);color:white;font-weight:850;font-size:18px;padding:13px 22px;cursor:pointer}
  .mini{font-size:14px;color:#666;width:100%;text-align:center;margin-top:2px}
  .result{display:none;text-align:center;padding:30px 24px 18px}
  .result h2{font-size:clamp(31px,6vw,46px);margin:8px 0 8px;color:var(--teal-dark)}
  .result p{font-size:clamp(18px,4vw,23px);line-height:1.65;margin:6px auto 16px;max-width:720px}
  .meter{width:min(560px,100%);height:18px;background:#eee;border-radius:999px;margin:18px auto;overflow:hidden}
  .meter > div{height:100%;background:var(--teal);width:0%;transition:width .5s}
  .review{margin-top:18px;text-align:left;display:grid;gap:12px}
  .review-card{background:#fffdf6;border:1px solid #e4dac2;border-radius:14px;padding:14px 15px;line-height:1.55}
  .review-card b{color:var(--teal-dark);font-size:18px}
  .review-card .small{color:#666;font-size:14px;margin-top:4px}
  @media (min-width:740px){.choices{grid-template-columns:1fr 1fr}}
  @media (max-width:520px){
    header{min-height:64px;padding:10px 13px 10px 16px}
    .counter{font-size:17px;padding:8px 12px;min-width:76px}
    main{padding:22px 14px 12px;gap:13px}
    .qbox{min-height:145px;border-radius:14px;padding:17px 14px}
    .choices{gap:11px}
    .choice{min-height:62px;border-radius:9px}
    .feedback{min-height:42px}
    .bottom{padding-bottom:18px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">Vintage 学校テスト対策 Section 219<span class="sub">範囲：No.848〜853</span></div>
    <div class="counter" id="counter">SET 01</div>
  </header>
  <main id="quiz">
    <div class="qmeta">
      <div class="badge" id="qNo">No.1</div>
      <div class="score" id="liveScore">正解 0</div>
    </div>
    <section class="qbox">
      <p class="en" id="en"></p>
      <p class="ja" id="ja"></p>
    </section>
    <section class="choices" id="choices"></section>
    <div class="feedback" id="feedback"></div>
  </main>
  <section class="result" id="result">
    <h2 id="resultTitle">学習モードを選ぶ</h2>
    <p id="resultText">範囲：No.848〜853</p>
    <div class="meter"><div id="meterBar"></div></div>
    <button class="btn" id="startAllBtn">全問解く</button>
    <button class="btn" id="startReviewBtn">前回間違えた問題を解く</button>
    <p><label for="numberInput">問題番号を指定：</label><input id="numberInput" type="text" inputmode="numeric" placeholder="例：848 または 848-853" /></p>
    <button class="btn" id="startNumberBtn">指定した問題を解く</button>
    <button class="btn" id="restartBtn">ホームへ戻る</button>
    <div class="review" id="review"></div>
  </section>
  <div class="bottom">
    <div class="mini">答えを選ぶと、自動で次の問題へ進みます。間違えた問題は復習リストに保存されます。</div>
  </div>
</div>
<script>
// 問題は、先生指定の画像から確認できたものだけを登録する。
const QUESTIONS = [
  {
    id: "vintage_219_848",
    no: 848,
    section: 219,
    type: "blank",
    sentence: "I cannot (    ) a kimono by myself, so my mother always helps me.",
    choices: ["put on", "wear", "wearing", "wear out"],
    answer: "put on",
    japanese: "私は一人で着物を着ることができないので、母がいつも手伝ってくれます。"
  },
  {
    id: "vintage_219_849",
    no: 849,
    section: 219,
    type: "blank",
    sentence: "That hat is just the color I’ve been looking for. May I (    ), please?",
    choices: ["do away with it", "try it on", "tear it off", "search it"],
    answer: "try it on",
    japanese: "その帽子はまさに私が探していた色です。試着してもいいですか。"
  },
  {
    id: "vintage_219_850",
    no: 850,
    section: 219,
    type: "converted_blank",
    sentence: "Please (    ) your shoes after you step into the entrance.",
    choices: ["repair", "remove", "regain", "restrict"],
    answer: "remove",
    japanese: "玄関に入ったら、靴を脱いでください。",
    originalTarget: "take off"
  },
  {
    id: "vintage_219_851",
    no: 851,
    section: 219,
    type: "converted_blank",
    sentence: "He had to (    ) his employees’ request.",
    choices: ["accept", "criticize", "follow", "reject"],
    answer: "reject",
    japanese: "彼は従業員たちの要求を断らなければなりませんでした。",
    originalTarget: "turn down"
  },
  {
    id: "vintage_219_852",
    no: 852,
    section: 219,
    type: "blank",
    sentence: "Hey, I love this song. Could you turn (    ) the volume, please?",
    choices: ["out", "into", "up", "from"],
    answer: "up",
    japanese: "ねえ、この曲好きです。音量を上げてもらえますか。"
  },
  {
    id: "vintage_219_853",
    no: 853,
    section: 219,
    type: "blank",
    sentence: "Please be sure to (    ) the gas before you leave the apartment.",
    choices: ["turn off", "stop off", "blow out", "shut out"],
    answer: "turn off",
    japanese: "アパートを出る前に、必ずガスを止めてください。"
  }
];

const questions = QUESTIONS.map(question => ({
  ...question,
  en: question.sentence,
  ja: question.japanese
}));

const APP_ID = 'ENG-SCHOOL-VINTAGE-GRAMMAR-4TAKU-SET01';
const REVIEW_STORAGE_KEY = 'vintage_grammar_set01_review_v1';

let activeQuestions = [];
let sessionMode = '';
let index = 0;
let correctCount = 0;
let answers = [];
let locked = false;
let autoTimer = null;
const $ = id => document.getElementById(id);

function loadReviewList() {
  try {
    const value = JSON.parse(localStorage.getItem(REVIEW_STORAGE_KEY) || '[]');
    return Array.isArray(value)
      ? [...new Set(value.map(Number).filter(no => questions.some(q => q.no === no)))].sort((a, b) => a - b)
      : [];
  } catch (e) {
    return [];
  }
}

function saveReviewList(list) {
  const value = [...new Set(list.map(Number))]
    .filter(no => questions.some(q => q.no === no))
    .sort((a, b) => a - b);
  try {
    localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(value));
  } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showHome(message = '') {
  clearTimeout(autoTimer);
  $('quiz').style.display = 'none';
  $('result').style.display = 'block';
  $('resultTitle').textContent = '学習モードを選ぶ';
  $('resultText').textContent = '範囲：No.848〜853';
  $('meterBar').parentElement.style.display = 'none';
  $('startAllBtn').style.display = 'inline-block';
  $('startReviewBtn').style.display = 'inline-block';
  $('numberInput').parentElement.style.display = 'block';
  $('startNumberBtn').style.display = 'inline-block';
  $('restartBtn').style.display = 'none';
  $('review').innerHTML = message
    ? `<div class="review-card">${escapeHtml(message)}</div>`
    : `<div class="review-card"><b>復習リスト：${loadReviewList().length}問</b><div class="small">Vintage番号は「848」「848,850」「848-853」の形式で指定できます。</div></div>`;
  $('counter').textContent = 'SET 01';
}

function startSession(selected, mode) {
  if (!selected.length) return;
  activeQuestions = selected;
  sessionMode = mode;
  index = 0;
  correctCount = 0;
  answers = Array(activeQuestions.length).fill(null);
  render();
}

function render() {
  clearTimeout(autoTimer);
  locked = false;
  const q = activeQuestions[index];
  $('quiz').style.display = 'flex';
  $('result').style.display = 'none';
  $('counter').textContent = `${index + 1}/${activeQuestions.length}`;
  $('qNo').textContent = `Vintage No.${q.no}`;
  $('liveScore').textContent = `正解 ${correctCount}`;
  $('en').textContent = q.en;
  $('ja').textContent = q.ja;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('choices').innerHTML = '';

  shuffle(q.choices).forEach(choice => {
    const button = document.createElement('button');
    button.className = 'choice';
    button.type = 'button';
    button.textContent = choice;
    button.addEventListener('click', () => select(choice));
    $('choices').appendChild(button);
  });
}

function select(choice) {
  if (locked) return;
  locked = true;
  answers[index] = choice;
  const q = activeQuestions[index];
  const ok = choice === q.answer;
  const reviewList = loadReviewList();

  if (ok) {
    correctCount += 1;
    if (sessionMode === 'review') {
      saveReviewList(reviewList.filter(no => no !== q.no));
    }
  } else {
    saveReviewList([...reviewList, q.no]);
  }

  document.querySelectorAll('.choice').forEach(button => {
    button.disabled = true;
    if (button.textContent === q.answer) button.classList.add('correct');
    else if (button.textContent === choice) button.classList.add('wrong');
    else button.classList.add('dim');
  });

  $('feedback').textContent = ok ? '正解！' : `惜しい！ 正解は「${q.answer}」`;
  $('feedback').className = 'feedback ' + (ok ? 'ok' : 'bad');
  $('liveScore').textContent = `正解 ${correctCount}`;

  if (ok) beep(880, 90);
  autoTimer = setTimeout(() => {
    if (index < activeQuestions.length - 1) {
      index += 1;
      render();
    } else {
      showResult();
    }
  }, ok ? 850 : 1850);
}

function beep(freq, duration) {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000);
  } catch (e) {}
}

function showResult() {
  clearTimeout(autoTimer);
  $('quiz').style.display = 'none';
  $('result').style.display = 'block';
  $('counter').textContent = `${correctCount}/${activeQuestions.length}`;
  const rate = Math.round(correctCount / activeQuestions.length * 100);
  $('meterBar').parentElement.style.display = 'block';
  $('meterBar').style.width = rate + '%';
  $('resultTitle').textContent = correctCount === activeQuestions.length ? '全問正解！' : '結果';
  $('resultText').textContent = `${activeQuestions.length}問中 ${correctCount}問正解です。正答率 ${rate}％。`;
  $('startAllBtn').style.display = 'none';
  $('startReviewBtn').style.display = 'none';
  $('numberInput').parentElement.style.display = 'none';
  $('startNumberBtn').style.display = 'none';
  $('restartBtn').style.display = 'inline-block';

  const wrong = activeQuestions.map((q, i) => ({q, i})).filter(x => answers[x.i] !== x.q.answer);
  if (wrong.length === 0) {
    $('review').innerHTML = '<div class="review-card"><b>すばらしいです。</b><br>今回の問題は全部できました。</div>';
  } else {
    $('review').innerHTML = wrong.map(({q, i}) => `
      <div class="review-card">
        <b>Vintage No.${q.no}　${escapeHtml(q.answer)}</b><br>
        ${escapeHtml(q.en)}<br>
        ${escapeHtml(q.ja)}
        <div class="small">あなたの答え：${escapeHtml(answers[i] || '未回答')}</div>
      </div>`).join('');
  }
}

function parseQuestionNumbers(value) {
  const normalized = value.normalize('NFKC').replace(/、/g, ',').replace(/\s+/g, '');
  if (!normalized) throw new Error('問題番号を入力してください。');
  const numbers = [];
  normalized.split(',').forEach(part => {
    if (/^\d+$/.test(part)) {
      numbers.push(Number(part));
      return;
    }
    const range = part.match(/^(\d+)-(\d+)$/);
    if (!range || Number(range[1]) > Number(range[2])) {
      throw new Error('「848,850,851-853」の形式で入力してください。');
    }
    for (let no = Number(range[1]); no <= Number(range[2]); no++) numbers.push(no);
  });
  const result = [...new Set(numbers)];
  if (result.some(no => !questions.some(q => q.no === no))) {
    throw new Error('この番号の問題は登録されていません');
  }
  return result;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>'"]/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
  }[ch]));
}

$('startAllBtn').addEventListener('click', () => {
  if (!questions.length) {
    showHome('問題画像の登録待ちです。');
    return;
  }
  startSession([...questions], 'all');
});

$('startReviewBtn').addEventListener('click', () => {
  const reviewNos = loadReviewList();
  if (!reviewNos.length) {
    showHome('復習リストは空です。まず「全問解く」に挑戦してください。');
    return;
  }
  startSession(reviewNos.map(no => questions.find(q => q.no === no)).filter(Boolean), 'review');
});

$('startNumberBtn').addEventListener('click', () => {
  try {
    const numbers = parseQuestionNumbers($('numberInput').value);
    startSession(numbers.map(no => questions.find(q => q.no === no)), 'number');
  } catch (e) {
    showHome(e.message);
  }
});

$('numberInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') $('startNumberBtn').click();
});

$('restartBtn').addEventListener('click', () => showHome());

window.VINTAGE_GRAMMAR_APP = Object.freeze({APP_ID, REVIEW_STORAGE_KEY});
showHome();
</script>
</body>
</html>
