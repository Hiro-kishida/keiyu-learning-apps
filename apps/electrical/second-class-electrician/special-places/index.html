<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b3d" />
    <meta name="description" content="第二種電気工事士・特殊な場所の合成樹脂管工事を4問で反復する○×学習アプリ" />
    <title>特殊な場所 ○×チャレンジ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1b3d'/%3E%3Cpath d='M32 10 49 20v24L32 54 15 44V20z' fill='%23f7c85b'/%3E%3Cpath d='M27 20h10v10h8v8h-8v10H27V38h-8v-8h8z' fill='%230d1b3d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="screen" id="home-screen" aria-labelledby="home-title">
        <div class="brand-mark" aria-hidden="true">⚡</div>
        <p class="eyebrow">第二種電気工事士</p>
        <h1 id="home-title">特殊な場所</h1>
        <p class="lead">合成樹脂管 ○×チャレンジ</p>
        <p class="small-note">4問だけ！ すぐ終わる。</p>
        <div class="mode-buttons" id="mode-buttons">
          <button class="primary-button" id="start-stage1" type="button">スタート</button>
        </div>
      </section>

      <section class="screen hidden" id="quiz-screen" aria-live="polite">
        <div class="quiz-topline">
          <span id="mode-label">固定4問</span>
          <span id="question-count">1 / 4</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <div class="question-card">
          <p class="question-number" id="question-number">QUESTION 01</p>
          <h2 id="question-text"></h2>
          <p class="question-prompt">合成樹脂管工事はできる？</p>
        </div>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="answer-grid" aria-label="答えを選ぶ">
          <button class="answer-button correct-choice" id="answer-true" type="button" aria-label="まる、できる">○</button>
          <button class="answer-button wrong-choice" id="answer-false" type="button" aria-label="ばつ、できない">×</button>
        </div>
      </section>

      <section class="screen hidden" id="result-screen" aria-live="polite">
        <div class="result-icon" id="result-icon" aria-hidden="true">✦</div>
        <p class="eyebrow" id="result-kicker">STAGE 1</p>
        <h2 id="result-title"></h2>
        <p class="result-message" id="result-message"></p>
        <div class="result-actions" id="result-actions"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
